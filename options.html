<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻譯設定</title>
    <style>
        :root {
            --bg: #f6efe6;
            --bg-wash: #eee5d8;
            --card: #fffaf3;
            --card-soft: #f8f1e8;
            --text: #34251f;
            --muted: #7b655b;
            --primary: #a55143;
            --primary-strong: #8e4337;
            --border: #dccabd;
            --ok: #5f7d4a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 22px;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(255, 250, 243, 0.92) 0, rgba(255, 250, 243, 0) 24%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-wash) 100%);
            color: var(--text);
            font-family: "Noto Sans TC", "Hiragino Sans", "Yu Gothic UI", sans-serif;
        }

        .card {
            max-width: 760px;
            min-width: 480px;
            min-height: 560px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px 15px 20px 16px;
            padding: 24px;
            box-shadow: 0 10px 24px rgba(79, 57, 46, 0.07), inset 0 1px 0 rgba(255,255,255,0.7);
        }

        .top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .help-btn {
            width: 28px;
            min-width: 28px;
            height: 28px;
            min-height: 28px;
            padding: 0;
            border-radius: 11px 9px 13px 8px;
            border: 1px solid #d7c2b4;
            background: linear-gradient(180deg, #fffdf9 0%, #f8eee0 100%);
            color: #7d5547;
            font-size: 13px;
            font-weight: 800;
            line-height: 1;
            box-shadow: 0 3px 8px rgba(79, 57, 46, 0.06);
        }

        h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            font-family: "Noto Serif TC", "Hiragino Mincho ProN", "Yu Mincho", serif;
        }

        .desc {
            margin: 8px 0 16px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
            max-width: 44ch;
        }

        .current {
            margin: 0 0 12px;
            font-size: 12px;
            color: var(--muted);
            background:
                linear-gradient(180deg, rgba(255, 252, 247, 0.96) 0%, rgba(250, 242, 232, 0.96) 100%);
            border: 1px solid var(--border);
            border-radius: 14px 12px 16px 11px;
            padding: 12px 14px 12px 16px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.72);
        }

        .current::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 4px;
            border-radius: 999px;
            background: linear-gradient(180deg, #c89178 0%, #a55143 100%);
        }

        .current strong {
            color: var(--text);
        }

        .section {
            border: 1px solid var(--border);
            border-radius: 18px 15px 20px 16px;
            background:
                linear-gradient(180deg, rgba(255, 253, 249, 0.98) 0%, rgba(255, 249, 242, 0.98) 100%);
            padding: 16px 16px 17px;
            margin-top: 14px;
            box-shadow: 0 6px 16px rgba(79, 57, 46, 0.04), inset 0 1px 0 rgba(255,255,255,0.72);
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: "";
            position: absolute;
            left: 16px;
            right: 16px;
            top: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(197, 139, 113, 0), rgba(197, 139, 113, 0.55), rgba(197, 139, 113, 0));
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #7f594d;
            font-family: "Noto Serif TC", "Hiragino Mincho ProN", "Yu Mincho", serif;
            letter-spacing: 0.02em;
        }

        .section-title::after {
            content: "";
            flex: 1 1 auto;
            height: 1px;
            background: linear-gradient(90deg, rgba(176, 132, 108, 0.55), rgba(176, 132, 108, 0));
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            border-radius: 14px 12px 16px 11px;
            background: #fffdf9;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        select:focus {
            border-color: #e4878f;
            box-shadow: 0 0 0 3px rgba(217, 31, 38, 0.14);
        }

        textarea,
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 14px 12px 16px 11px;
            background: #fffdf9;
            color: var(--text);
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        textarea:focus,
        input[type="text"]:focus {
            border-color: #e4878f;
            box-shadow: 0 0 0 3px rgba(217, 31, 38, 0.14);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            margin-top: 10px;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid #a45c49;
            border-radius: 14px 12px 16px 11px;
            padding: 10px 16px;
            background: var(--primary);
            color: #fffdf9;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-strong);
        }

        button:focus-visible {
            outline: 2px solid #e86973;
            outline-offset: 2px;
        }

        .btn-secondary {
            background: #fff8f1;
            color: #7d5547;
            border: 1px solid #e0d0c2;
        }

        .btn-secondary:hover {
            background: #fcf2e7;
        }

        .status {
            font-size: 12px;
            color: var(--ok);
            min-height: 16px;
        }

        .switch-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin: 12px 0 0;
            padding: 13px 14px 14px;
            border: 1px dashed #d8c9bc;
            border-radius: 14px 12px 16px 11px;
            background:
                linear-gradient(180deg, rgba(255, 252, 247, 0.96) 0%, rgba(251, 244, 235, 0.96) 100%);
        }

        .switch-title {
            font-size: 14px;
            font-weight: 700;
            color: #62473d;
        }

        .switch-desc {
            margin-top: 3px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.55;
            max-width: 56ch;
        }

        .translation-engine-hint {
            margin-top: 8px;
            padding: 10px 12px;
            border: 1px solid rgba(165, 81, 67, 0.26);
            border-radius: 12px 10px 14px 9px;
            background:
                linear-gradient(135deg, rgba(255, 245, 232, 0.98), rgba(255, 239, 220, 0.92)),
                radial-gradient(circle at right top, rgba(197, 104, 81, 0.14), transparent 58%);
            color: #7d5547;
            box-shadow: 0 10px 18px rgba(165, 81, 67, 0.08);
            transform-origin: top left;
        }

        .translation-engine-hint.is-animating {
            animation: translationHintEnter 520ms cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes translationHintEnter {
            0% {
                opacity: 0;
                transform: translateY(-6px) scale(0.97);
                box-shadow: 0 0 0 rgba(165, 81, 67, 0);
            }
            58% {
                opacity: 1;
                transform: translateY(0) scale(1.01);
                box-shadow: 0 12px 22px rgba(165, 81, 67, 0.16);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                box-shadow: 0 10px 18px rgba(165, 81, 67, 0.08);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .translation-engine-hint.is-animating {
                animation: none;
            }
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
            flex: 0 0 auto;
            margin-top: 2px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                linear-gradient(180deg, #e7d9cb 0%, #d7c2b3 100%);
            transition: .2s;
            border-radius: 16px 14px 17px 13px;
            border: 1px solid #ceb9aa;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.54);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            top: 4px;
            background: linear-gradient(180deg, #fffdfa 0%, #f8eee1 100%);
            transition: .2s;
            border-radius: 8px 7px 9px 6px;
            box-shadow: 0 2px 6px rgba(71, 46, 36, 0.14);
        }

        input:checked + .slider {
            background: linear-gradient(180deg, #bf7a63 0%, #a45a49 100%);
            border-color: #b36a54;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .io-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 10px;
            color: #7f594d;
            font-family: "Noto Serif TC", "Hiragino Mincho ProN", "Yu Mincho", serif;
            letter-spacing: 0.02em;
        }

        .io-title::after {
            content: "";
            flex: 1 1 auto;
            height: 1px;
            background: linear-gradient(90deg, rgba(176, 132, 108, 0.55), rgba(176, 132, 108, 0));
        }

        .io-actions {
            display: flex;
            gap: 10px;
            row-gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .io-actions .btn-secondary {
            padding: 11px 18px;
        }

        .export-dropdown {
            position: relative;
            display: inline-block;
        }

        .export-menu {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            background: #fffdf9;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(72,54,45,0.13);
            min-width: 190px;
            z-index: 200;
            overflow: hidden;
        }

        .export-menu.open {
            display: block;
        }

        .export-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px 16px;
            background: none;
            border: none;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            font-size: 13px;
            color: var(--text);
            font-family: inherit;
        }

        .export-menu button:last-child {
            border-bottom: none;
        }

        .export-menu button:hover {
            background: rgba(165,81,67,0.07);
            color: #a55143;
        }

        .simple-import {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed var(--border);
        }

        #translationEngine {
            margin-top: 9px;
            margin-bottom: 8px;
        }

        .simple-import .io-actions {
            margin-top: 14px;
        }

        .domain-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }

        .domain-row input {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 14px 12px 16px 11px;
            font-size: 13px;
            outline: none;
        }

        .domain-row input:focus {
            border-color: #e4878f;
            box-shadow: 0 0 0 3px rgba(217, 31, 38, 0.14);
        }

        .domain-list {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .domain-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, #fffdf9 0%, #f8efe4 100%);
            border-radius: 12px 10px 14px 9px;
            padding: 6px 10px;
            font-size: 12px;
            color: #6b4d43;
            box-shadow: 0 2px 6px rgba(79, 57, 46, 0.04);
        }

        .domain-chip button {
            border: 0;
            background: transparent;
            color: #8b6a5f;
            font-size: 12px;
            padding: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="top">
            <div>
                <h2 id="optionsTitle">翻譯設定</h2>
                <p class="desc" id="optionsDesc">設定即時翻譯使用的來源語言。</p>
            </div>
            <div class="top-actions">
                <button class="help-btn" id="helpBtn" type="button" aria-label="Help">?</button>
            </div>
        </div>

        <p class="current"><span id="currentLangLabel">目前語言</span>：<strong id="currentLang">載入中...</strong></p>

        <div class="section">
            <div class="section-title" id="generalSettingsTitle">一般設定</div>
            <div>
                <label for="sourceLang" id="sourceLangLabel">翻譯來源語言</label>
                <select id="sourceLang">
                    <option value="auto">Auto</option>
                    <option value="en-US">English | English</option>
                    <option value="id-ID">Indonesian | Bahasa Indonesia</option>
                    <option value="es-ES">Spanish | Español</option>
                    <option value="fr-FR">French | Français</option>
                    <option value="de-DE">German | Deutsch</option>
                    <option value="it-IT">Italian | Italiano</option>
                    <option value="pt-PT">Portuguese | Português</option>
                    <option value="pt-BR">Portuguese (Brazil) | Português (Brasil)</option>
                    <option value="nl-NL">Dutch | Nederlands</option>
                    <option value="ru-RU">Russian | Русский</option>
                    <option value="zh-CN">Chinese (Simplified) | 简体中文</option>
                    <option value="zh-TW">Chinese (Traditional) | 繁體中文</option>
                    <option value="ja-JP">Japanese | 日本語</option>
                    <option value="ko-KR">Korean | 한국어</option>
                    <option value="ms-MY">Malay | Bahasa Melayu</option>
                    <option value="th-TH">Thai | ไทย</option>
                    <option value="ta-IN">Tamil | தமிழ்</option>
                    <option value="te-IN">Telugu | తెలుగు</option>
                    <option value="vi-VN">Vietnamese | Tiếng Việt</option>
                    <option value="tl-PH">Filipino | Filipino</option>
                    <option value="sw-KE">Swahili | Kiswahili</option>
                    <option value="my-MM">Burmese | မြန်မာ</option>
                    <option value="km-KH">Khmer | ខ្មែរ</option>
                    <option value="lo-LA">Lao | ລາວ</option>
                    <option value="jv-ID">Javanese | Basa Jawa</option>
                    <option value="su-ID">Sundanese | Basa Sunda</option>
                    <option value="ar-SA">Arabic | العربية</option>
                    <option value="hi-IN">Hindi | हिन्दी</option>
                    <option value="bn-BD">Bengali | বাংলা</option>
                    <option value="ur-PK">Urdu | اردو</option>
                    <option value="fa-IR">Persian | فارسی</option>
                    <option value="tr-TR">Turkish | Türkçe</option>
                    <option value="he-IL">Hebrew | עברית</option>
                    <option value="el-GR">Greek | Ελληνικά</option>
                    <option value="pl-PL">Polish | Polski</option>
                    <option value="cs-CZ">Czech | Čeština</option>
                    <option value="hu-HU">Hungarian | Magyar</option>
                    <option value="ro-RO">Romanian | Română</option>
                    <option value="sv-SE">Swedish | Svenska</option>
                </select>
            </div>

            <div>
                <label for="uiLanguage" id="uiLangLabel">介面語言</label>
                <select id="uiLanguage">
                    <option value="zh-TW">中文</option>
                    <option value="zh-CN">简体中文</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="pt">Português</option>
                    <option value="ar">العربية</option>
                    <option value="hi">हिन्दी</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                    <option value="id">Bahasa Indonesia</option>
                    <option value="ru">Русский</option>
                    <option value="es">Español</option>
                </select>
            </div>

            <div>
                <label for="translationEngine" id="translationEngineLabel">翻譯引擎</label>
                <div class="switch-desc" id="translationEngineDesc">選擇使用線上翻譯或瀏覽器內建翻譯。</div>
                <select id="translationEngine">
                    <option value="online">線上翻譯</option>
                    <option value="browser">瀏覽器翻譯</option>
                </select>
                <div class="switch-desc translation-engine-hint" id="translationEngineHint" hidden>瀏覽器翻譯速度更快，但效果略遜於線上翻譯。</div>
            </div>

            <div class="switch-row">
                <div>
                    <div class="switch-title" id="autoTranslateLabel">勾選後自動翻譯</div>
                    <div class="switch-desc" id="autoTranslateDesc">選取文字時自動顯示翻譯浮框</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="autoTranslateOnSelect">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="switch-row" id="dictionaryLookupRow">
                <div>
                    <div class="switch-title" id="dictionaryLookupLabel">啟用印尼詞典查詢</div>
                    <div class="switch-desc" id="dictionaryLookupDesc">在翻譯結果中異步顯示 Kateglo 詞典詞性與解釋。</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="dictionaryLookupEnabled">
                    <span class="slider"></span>
                </label>
            </div>

            <div style="margin-top:12px;">
                <label id="excludedDomainsLabel" for="excludedDomainInput">排除網域</label>
                <div class="switch-desc" id="excludedDomainsDesc">這些網域不啟用高亮與例句功能。</div>
                <div class="domain-row">
                    <input id="excludedDomainInput" type="text" placeholder="" />
                    <button id="addExcludedDomainBtn" type="button">加入</button>
                </div>
                <div class="domain-list" id="excludedDomainList"></div>
            </div>
        </div>

        <div class="section">
            <div class="io-title" id="importExportLabel">匯入 / 匯出字庫</div>
            <div class="switch-desc" id="syncStorageHint">同步空間不足時，系統會優先精簡雲端副本，本地資料不受影響。</div>
            <div class="io-actions">
                <button id="syncBtn" class="btn-secondary" type="button">立即同步</button>
                <div class="export-dropdown" id="exportDropdown">
                    <button class="btn-secondary" id="exportMenuBtn" type="button">匯出 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 8.25l-7.5 7.5-7.5-7.5"/></svg></button>
                    <div class="export-menu" id="exportMenu">
                        <button id="exportBtn" type="button">JSON（本插件適用）</button>
                        <button id="exportCsvBtn" type="button">CSV（適合 Anki 等）</button>
                    </div>
                </div>
                <button id="importBtn" class="btn-secondary" type="button">匯入</button>
                <input type="file" id="importFile" style="display:none;" />
            </div>
            <div class="simple-import">
                <div class="switch-title" id="simpleImportLabel">簡易匯入</div>
                <div class="switch-desc" id="simpleImportDesc">貼上「單字, 意思」清單，或匯入 txt / csv。其餘資料會稍後自動補齊。</div>
                <textarea id="simpleImportInput" rows="6" placeholder=""></textarea>
                <div class="io-actions">
                    <button id="simpleImportBtn" class="btn-secondary" type="button">開始簡易匯入</button>
                    <button id="simpleImportFileBtn" class="btn-secondary" type="button">匯入 txt / csv</button>
                    <input type="file" id="simpleImportFile" accept=".txt,.csv,text/plain,text/csv" style="display:none;" />
                </div>
                <div class="switch-desc" id="simpleImportStatus"></div>
            </div>
        </div>

        <div class="actions">
            <button id="save">儲存</button>
            <span class="status" id="saveStatus"></span>
        </div>
    </div>

    <script src="lib/storage-merge-utils.js"></script>
    <script src="lib/dictionary-utils.js"></script>
    <script src="lib/lemma-utils.js"></script>
    <script src="lib/translation-utils.js"></script>
    <script src="storage.js"></script>
    <script src="ui-icons.js"></script>
    <script src="ui-i18n.js"></script>
    <script src="ui-tour.js"></script>
    <script src="ui-toast.js"></script>
    <script src="options.js"></script>
</body>
</html>
