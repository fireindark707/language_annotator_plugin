<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

</head>
<body>

  <div id="subtitle"></div>

  <div id="scoreChip"></div>
  <div id="streakChip"></div>
  <div id="challengeChip"></div>
  <div id="progressBar"></div>
  <div id="prompt"></div>
  <div id="stimulus"></div>
  <div id="options"></div>
  <div id="feedback"></div>
  <button id="clozeTranslateBtn"></button>
  <div id="clozeTranslateText"></div>
  <button id="nextBtn"></button>
  <button id="markLearnedBtn"></button>
  <div id="card"></div>
  <div id="summary"></div>
  <div id="summaryTitle"></div>
  <div id="summaryBadge"></div>
  <div id="summaryBigScore"></div>
  <div id="summaryComment"></div>
  <div id="summaryAccuracyLabel"></div>
  <div id="summaryCorrectLabel"></div>
  <div id="summaryBestStreakLabel"></div>
  <div id="summaryAccuracy"></div>
  <div id="summaryCorrect"></div>
  <div id="summaryBestStreak"></div>
  <div id="summaryText"></div>
  <div id="summaryCelebrate"></div>
  <div id="summaryReviewed"></div>
  <div id="summaryReviewedTitle"></div>
  <div id="summaryReviewedDesc"></div>
  <div id="summaryReviewedList"></div>
  <button id="applyLearnedWordsBtn"></button>
  <div id="megaOverlay"></div>
  <div id="megaText"></div>
  <div id="answerFlash"></div>
  <button id="nextRoundBtn"></button>
  <div id="celebrate"></div>
  <pre id="test-output"></pre>
  <script>
    window.chrome = {
      runtime: {
        lastError: null,
        sendMessage(message, callback) { callback({ translation: "" }); },
      },
    };
    window.UiI18n = {
      t(lang, key) { return key; },
      langAttr(lang) { return lang || "en"; },
      dir(lang) { return (lang || "").startsWith("ar") ? "rtl" : "ltr"; },
    };
    window.UiTour = { maybeStartOnce() {}, start() {}, reset() { return Promise.resolve(); }, getSteps() { return []; }, getLabel() { return "replay"; } };
    window.WordStorage = {
      getUiLanguage() { return Promise.resolve("en"); },
      getWords() { return Promise.resolve({}); },
      getSourceLang() { return Promise.resolve("en"); },
      saveWords() { return Promise.resolve(); },
    };
    window.speechSynthesis = { cancel() {}, speak() {}, getVoices() { return []; } };
    window.AudioContext = function () {};
    window.webkitAudioContext = function () {};
  </script>
  <script src="../lib/translation-utils.js"></script>
  <script src="../lib/practice-utils.js"></script>
  <script src="../lib/sentence-splitter.js"></script>
  <script src="../lib/example-utils.js"></script>
  <script src="../practice.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;

    runTests([
      {
        name: "getQuestionPool excludes learned or empty-meaning entries",
        run() {
          allWords = [
            { word: "alpha", meaning: "A", learned: false },
            { word: "beta", meaning: "", learned: false },
            { word: "gamma", meaning: "G", learned: true },
          ];
          const pool = getQuestionPool();
          assertEqual(pool.length, 1);
          assertEqual(pool[0].word, "alpha");
        },
      },
      {
        name: "buildClozeStimulus blanks exact whole-word matches only",
        run() {
          const text = buildClozeStimulus("run", [
            "I run every morning.",
            "Running is healthy.",
          ], "en");
          assert(text.includes("_____"), "expected blanked cloze");
          assertEqual(buildClozeStimulus("run", ["Running is healthy."], "en"), "");
        },
      },
      {
        name: "buildClozeStimulus supports compact-script matching when given a language hint",
        run() {
          const text = buildClozeStimulus("学校", [
            "今日は学校へ行きます。",
            "学校",
          ], "ja");
          assertEqual(text, "今日は_____へ行きます。");
        },
      },
      {
        name: "isSuitableClozeSentence rejects too-short too-long and noisy examples",
        run() {
          assertEqual(PracticeUtils.isSuitableClozeSentence("run now", "run"), false);
          assertEqual(PracticeUtils.isSuitableClozeSentence("I run every morning before breakfast with my neighbor near the river and then continue through the old market before heading back home for coffee and another short walk.", "run"), false);
          assertEqual(PracticeUtils.isSuitableClozeSentence("run >>> ### $$$ %% ^^ &&", "run"), false);
          assertEqual(PracticeUtils.isSuitableClozeSentence("I run 12345 >>> 67890 every day.", "run"), false);
          assertEqual(PracticeUtils.isSuitableClozeSentence("I run every morning before breakfast.", "run", "en"), true);
          assertEqual(PracticeUtils.isSuitableClozeSentence("今日は学校へ行きます。", "学校", "ja"), true);
        },
      },
      {
        name: "buildClozeStimulus skips unsuitable candidates before picking a usable sentence",
        run() {
          const text = buildClozeStimulus("run", [
            "run now",
            "run >>> ### $$$ %% ^^ &&",
            "I run every morning before breakfast.",
          ], "en");
          assertEqual(text, "I _____ every morning before breakfast.");
        },
      },
      {
        name: "buildQuestion only uses cloze within the configured probability band",
        run() {
          const originalRandom = Math.random;
          allWords = [
            { word: "alpha", meaning: "A", learned: false, examples: ["alpha appears right here today."] },
            { word: "beta", meaning: "B", learned: false, examples: ["beta appears right here today."] },
            { word: "gamma", meaning: "G", learned: false, examples: ["gamma appears right here today."] },
            { word: "delta", meaning: "D", learned: false, examples: ["delta appears right here today."] },
          ];
          Math.random = () => Math.min(CLOZE_PROBABILITY + 0.05, 0.95);
          try {
            const q = buildQuestion(allWords[0]);
            assertEqual(q.mode === "cloze", false);
          } finally {
            Math.random = originalRandom;
          }
        },
      },
      {
        name: "buildQuestion still allows cloze inside the configured probability band",
        run() {
          const originalRandom = Math.random;
          allWords = [
            { word: "alpha", meaning: "A", learned: false, examples: ["alpha appears right here today."] },
            { word: "beta", meaning: "B", learned: false, examples: ["beta appears right here today."] },
            { word: "gamma", meaning: "G", learned: false, examples: ["gamma appears right here today."] },
            { word: "delta", meaning: "D", learned: false, examples: ["delta appears right here today."] },
          ];
          Math.random = () => Math.max(CLOZE_PROBABILITY - 0.05, 0);
          try {
            const q = buildQuestion(allWords[0]);
            assertEqual(q.mode, "cloze");
          } finally {
            Math.random = originalRandom;
          }
        },
      },
      {
        name: "buildQuestion splits remaining probability evenly across non-cloze modes",
        run() {
          const originalRandom = Math.random;
          const word2MeaningRoll = CLOZE_PROBABILITY + (((1 - CLOZE_PROBABILITY) / 2) / 2);
          const meaning2WordRoll = CLOZE_PROBABILITY + (((1 - CLOZE_PROBABILITY) / 2) + 0.01);
          allWords = [
            { word: "alpha", meaning: "A", learned: false, examples: ["alpha appears right here today."] },
            { word: "beta", meaning: "B", learned: false, examples: ["beta appears right here today."] },
            { word: "gamma", meaning: "G", learned: false, examples: ["gamma appears right here today."] },
            { word: "delta", meaning: "D", learned: false, examples: ["delta appears right here today."] },
          ];
          try {
            Math.random = () => word2MeaningRoll;
            assertEqual(buildQuestion(allWords[0]).mode, "word2meaning");
            Math.random = () => meaning2WordRoll;
            assertEqual(buildQuestion(allWords[0]).mode, "meaning2word");
          } finally {
            Math.random = originalRandom;
          }
        },
      },
      {
        name: "cloze exercise prompt coverage includes every configured source language base",
        run() {
          const expectedBases = [
            "ar", "bn", "cs", "de", "el", "en", "es", "fa", "fr", "he", "hi", "hu",
            "id", "it", "ja", "jv", "km", "ko", "lo", "ms", "my", "nl", "pl", "pt",
            "ro", "ru", "su", "sv", "sw", "ta", "te", "th", "tl", "tr", "ur", "vi", "zh",
          ];
          expectedBases.forEach((base) => {
            assert(!!CLOZE_EXERCISE_PROMPTS[base], `missing cloze prompt for ${base}`);
            assert(typeof CLOZE_EXERCISE_PROMPTS[base].blank === "string" && CLOZE_EXERCISE_PROMPTS[base].blank.length > 0, `missing blank text for ${base}`);
          });
        },
      },
      {
        name: "getReviewedWordsUnique deduplicates while dropping falsy values",
        run() {
          reviewedWordsThisRound = ["alpha", "beta", "", "alpha", null, "beta"];
          const unique = getReviewedWordsUnique();
          assertEqual(unique.length, 2);
          assertEqual(unique[0], "alpha");
          assertEqual(unique[1], "beta");
        },
      },
      {
        name: "summary learned list only keeps words answered correctly on first appearance",
        run() {
          reviewedWordsThisRound = ["alpha", "beta", "gamma"];
          roundWordOutcomes = new Map([
            ["alpha", { firstAttemptCorrect: true }],
            ["beta", { firstAttemptCorrect: false }],
            ["gamma", { firstAttemptCorrect: true }],
          ]);
          const eligible = getSummaryEligibleWords();
          assertEqual(eligible.length, 2);
          assertEqual(eligible[0], "alpha");
          assertEqual(eligible[1], "gamma");
        },
      },
      {
        name: "overtime picker excludes words already answered correctly this round",
        run() {
          allWords = [
            { word: "alpha", meaning: "A", learned: false },
            { word: "beta", meaning: "B", learned: false },
            { word: "gamma", meaning: "G", learned: false },
          ];
          correctWordsThisRound = new Set(["alpha", "gamma"]);
          const picked = pickQuestionItem();
          assertEqual(picked.word, "beta");
        },
      },
      {
        name: "init shows low-word reminder instead of starting practice when fewer than four words exist",
        async run() {
          WordStorage.getUiLanguage = () => Promise.resolve("en");
          WordStorage.getWords = () => Promise.resolve({
            one: { meaning: "1", learned: false },
            two: { meaning: "2", learned: false },
            three: { meaning: "3", learned: false },
          });
          await init();
          assertEqual(feedbackEl.textContent, "practice_need_words");
          assertEqual(nextBtn.style.display, "none");
          assertEqual(markLearnedBtn.style.display, "none");
        },
      },
    ]);
  </script>
</body>
</html>
