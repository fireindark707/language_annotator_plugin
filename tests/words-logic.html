<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>words-logic</title>
</head>
<body>
  <button id="toggleViewBtn"></button>
  <button id="practiceBtn"></button>
  <select id="sortMode"></select>
  <div id="wordsList"></div>
  <div id="dictWordsList"></div>
  <div id="localResultBlock"></div>
  <div id="dictResultBlock"></div>
  <div id="wordStats"></div>
  <div id="languageStats"></div>
  <div id="autoLangHint"></div>
  <button id="closeBtn"></button>
  <input id="searchInput" />
  <button id="helpBtn"></button>
  <pre id="test-output"></pre>
  <script>
    const toastCalls = [];
    let translationEngineState = "online";
    window.chrome = {
      runtime: {
        lastError: null,
        getURL(path) { return path; },
        sendMessage(message, callback) {
          if (message.action === "translate") {
            callback({ translation: `T:${message.text}` });
            return;
          }
          if (message.action === "getLemma") {
            const lemmaMap = { berjalan: "jalan", makanan: "makan" };
            callback({ found: !!lemmaMap[message.text], lemma: lemmaMap[message.text] || "" });
            return;
          }
          callback({ found: false, entries: [] });
        },
      },
      tabs: { create() {} },
    };
    window.UiI18n = { t(lang, key) { return key; } };
    window.UiTour = { maybeStartOnce() {}, start() {}, reset() { return Promise.resolve(); } };
    window.UiToast = { show(message, level) { toastCalls.push({ message, level }); } };
    window.WordStorage = {
      getUiLanguage() { return Promise.resolve("en"); },
      getSourceLang() { return Promise.resolve("id"); },
      getTranslationEngine() { return Promise.resolve(translationEngineState); },
      getDictionaryLookupEnabled() { return Promise.resolve(true); },
      getWords() { return Promise.resolve({}); },
      saveWords() { return Promise.resolve(); },
    };
  </script>
  <script src="../lib/dictionary-utils.js"></script>
  <script src="../lib/lemma-utils.js"></script>
  <script src="../lib/translation-utils.js"></script>
  <script src="../lib/sentence-splitter.js"></script>
  <script src="../lib/example-utils.js"></script>
  <script src="../words.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;
    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    runTests([
      {
        name: "normalizeDictionaryQuery strips punctuation and keeps first token",
        run() {
          assertEqual(normalizeDictionaryQuery('  "running!" now  '), "running");
          assertEqual(normalizeDictionaryQuery("...berjalan,"), "berjalan");
        },
      },
      {
        name: "supportsDictionaryBySourceLang respects manual source language only",
        run() {
          assertEqual(supportsDictionaryBySourceLang("auto"), false);
          assertEqual(supportsDictionaryBySourceLang("id-ID"), true);
          assertEqual(supportsDictionaryBySourceLang("xx"), false);
        },
      },
      {
        name: "lemma language normalization maps fil to tl and rejects auto",
        run() {
          assertEqual(normalizeLemmaSourceLang("fil-PH"), "tl");
          assertEqual(normalizeLemmaSourceLang("pt-BR"), "pt");
          assertEqual(normalizeLemmaSourceLang("auto"), "");
        },
      },
      {
        name: "supportsLemmaBySourceLang reflects bundled simplemma language set",
        run() {
          assertEqual(supportsLemmaBySourceLang("pt-BR"), true);
          assertEqual(supportsLemmaBySourceLang("fil-PH"), true);
          assertEqual(supportsLemmaBySourceLang("auto"), false);
          assertEqual(supportsLemmaBySourceLang("zh-TW"), false);
        },
      },
      {
        name: "formatWordCount and tooltip match page/encounter semantics",
        run() {
          assertEqual(formatWordCount(3, 10), "3p · 10x");
          assertEqual(formatWordCountTooltip(3, 10), "count_pages: 3 · count_encounters: 10");
        },
      },
      {
        name: "resolveLemma uses background response and normalizes source language",
        async run() {
          const result = await resolveLemma("berjalan", "id-ID");
          assertEqual(result.query, "berjalan");
          assertEqual(result.lemma, "jalan");
          assertEqual(result.effectiveQuery, "jalan");
          assertEqual(result.lang, "id");
        },
      },
      {
        name: "backfillMissingLemmas fills only missing lemma fields and saves once",
        async run() {
          let saved = null;
          let updateCalls = 0;
          WordStorage.getSourceLang = () => Promise.resolve("id");
          WordStorage.getWords = () => Promise.resolve({
            berjalan: { meaning: "walk" },
            rumah: { meaning: "house", lemma: "rumah" },
          });
          WordStorage.saveWords = (words) => {
            saved = JSON.parse(JSON.stringify(words));
            return Promise.resolve();
          };
          updateWordsList = () => { updateCalls += 1; };
          lemmaBackfillStarted = false;
          lemmaBackfillPromise = null;

          const changed = await backfillMissingLemmas();
          assertEqual(changed, 1);
          assert(saved && saved.berjalan && saved.berjalan.lemma === "jalan", "expected missing lemma to be filled");
          assertEqual(saved.rumah.lemma, "rumah");
          assertEqual(updateCalls, 1);
        },
      },
      {
        name: "word meaning can be edited inline in fullscreen words view",
        async run() {
          const store = {
            vulgar: {
              meaning: "old meaning",
              learned: false,
              createdAt: 1,
              examples: [],
            },
          };
          let savedWordsPayload = null;
          let saveWordsOptions = null;
          WordStorage.getWords = () => Promise.resolve(JSON.parse(JSON.stringify(store)));
          WordStorage.saveWords = (words, options) => {
            savedWordsPayload = JSON.parse(JSON.stringify(words));
            saveWordsOptions = options || null;
            Object.assign(store, JSON.parse(JSON.stringify(words)));
            return Promise.resolve();
          };
          const meaningEl = document.createElement("div");
          meaningEl.className = "word-meaning is-editable";
          meaningEl.textContent = "old meaning";
          document.body.appendChild(meaningEl);

          startMeaningEdit("vulgar", meaningEl, "old meaning");
          await wait(25);
          const editor = meaningEl.querySelector(".word-meaning-editor");
          assert(editor, "expected inline editor");
          editor.value = "new meaning";
          editor.dispatchEvent(new Event("blur"));
          await wait(25);
          assert(savedWordsPayload && savedWordsPayload.vulgar, "expected saveWords to persist updated meaning");
          assertEqual(savedWordsPayload.vulgar.meaning, "new meaning");
          assertEqual(saveWordsOptions.syncMode, "immediate");
          assertEqual(meaningEl.textContent, "new meaning");
          assert(toastCalls.some((entry) => entry.message === "saved"), "expected saved toast");
          meaningEl.remove();
        },
      },
      {
        name: "fullscreen inline meaning edit cancels on escape without saving",
        async run() {
          let saveCalls = 0;
          WordStorage.getWords = () => Promise.resolve({
            vulgar: {
              meaning: "old meaning",
              learned: false,
              createdAt: 1,
              examples: [],
            },
          });
          WordStorage.saveWords = () => {
            saveCalls += 1;
            return Promise.resolve();
          };
          const meaningEl = document.createElement("div");
          meaningEl.className = "word-meaning is-editable";
          meaningEl.textContent = "old meaning";
          document.body.appendChild(meaningEl);

          startMeaningEdit("vulgar", meaningEl, "old meaning");
          await wait(25);
          const editor = meaningEl.querySelector(".word-meaning-editor");
          assert(editor, "expected inline editor");
          editor.value = "discarded";
          editor.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          await wait(25);
          assertEqual(saveCalls, 0);
          assertEqual(meaningEl.textContent, "old meaning");
          meaningEl.remove();
        },
      },
      {
        name: "random sort helper shuffles fullscreen words deterministically when Math.random is stubbed",
        run() {
          const originalRandom = Math.random;
          const rolls = [0, 0];
          Math.random = () => (rolls.length ? rolls.shift() : 0);
          try {
            const renderedWords = shuffleWordOrder(["alpha", "beta", "gamma"]);
            assertEqual(renderedWords.length, 3);
            assertEqual(renderedWords[0], "beta");
            assertEqual(renderedWords[1], "gamma");
            assertEqual(renderedWords[2], "alpha");
          } finally {
            Math.random = originalRandom;
          }
        },
      },
      {
        name: "browser translation fallback keeps fullscreen translation working and shows error reason",
        async run() {
          toastCalls.length = 0;
          const originalRequestPreferredTranslation = window.TranslationUtils.requestPreferredTranslation;
          window.TranslationUtils.requestPreferredTranslation = function requestPreferredTranslationStub(options) {
            if (options && typeof options.onBrowserFallback === "function") {
              options.onBrowserFallback({ reason: "pair_unavailable" });
            }
            return Promise.resolve("T:kalimat panjang untuk pengujian");
          };
          const translated = await translateExampleSentence("kalimat panjang untuk pengujian");
          assertEqual(translated, "T:kalimat panjang untuk pengujian");
          assert(toastCalls.some((entry) => entry.message === "browser_translation_pair_unavailable" && entry.level === "error"), "expected words fallback toast");
          window.TranslationUtils.requestPreferredTranslation = originalRequestPreferredTranslation;
        },
      },
    ]);
  </script>
</body>
</html>
