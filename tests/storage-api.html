<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>storage-api</title></head>
<body>
  <pre id="test-output"></pre>
  <script>
    function createArea(initial) {
      const store = Object.assign({}, initial || {});
      return {
        _store: store,
        get(keys, callback) {
          const out = {};
          if (Array.isArray(keys)) {
            keys.forEach((key) => { out[key] = store[key]; });
          } else {
            Object.keys(keys || {}).forEach((key) => { out[key] = key in store ? store[key] : keys[key]; });
          }
          callback(out);
        },
        set(data, callback) { Object.assign(store, data); callback && callback(); },
        remove(keys, callback) { [].concat(keys).forEach((key) => { delete store[key]; }); callback && callback(); },
      };
    }
    window.__LA_TEST_HOOKS__ = {};
    window.chrome = {
      runtime: { lastError: null },
      storage: {
        local: createArea({ words: { local: { meaning: 'L' } } }),
        sync: createArea({}),
      },
    };
    Object.defineProperty(window.navigator, 'language', { configurable: true, value: 'fr-FR' });
  </script>
  <script src="../lib/storage-merge-utils.js"></script>
  <script src="../storage.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;
    const S = window.WordStorage;
    runTests([
      {
        name: 'exportData returns all persisted fields',
        async run() {
          await S.saveSourceLang('id');
          await S.saveTranslationEngine('browser');
          await S.saveAutoTranslateOnSelect(false);
          await S.saveDictionaryLookupEnabled(true);
          await S.saveUiLanguage('fr');
          await S.saveExcludedDomains(['Example.com', '']);
          const data = await S.exportData();
          assertEqual(data.sourceLang, 'id');
          assertEqual(data.translationEngine, 'browser');
          assertEqual(data.autoTranslateOnSelect, false);
          assertEqual(data.dictionaryLookupEnabled, true);
          assertEqual(data.uiLanguage, 'fr');
          assertEqual(data.excludedDomains[0], 'example.com');
          assert(data.words.local, 'expected words in export');
        },
      },
      {
        name: 'importData writes words and settings through public api',
        async run() {
          await S.importData({
            words: { imported: { meaning: 'I' } },
            sourceLang: 'en',
            translationEngine: 'browser',
            autoTranslateOnSelect: true,
            dictionaryLookupEnabled: false,
            uiLanguage: 'pt',
            excludedDomains: ['Foo.COM'],
          });
          const words = await S.getWords();
          assert(words.imported, 'expected imported words');
          assertEqual(await S.getSourceLang(), 'en');
          assertEqual(await S.getTranslationEngine(), 'browser');
          assertEqual(await S.getAutoTranslateOnSelect(), true);
          assertEqual(await S.getDictionaryLookupEnabled(), false);
          assertEqual(await S.getUiLanguage(), 'pt');
          assertEqual((await S.getExcludedDomains())[0], 'foo.com');
        },
      },
      {
        name: 'importData preserves existing settings when legacy exports omit newer fields',
        async run() {
          await S.saveSourceLang('fr');
          await S.saveTranslationEngine('browser');
          await S.saveAutoTranslateOnSelect(false);
          await S.saveDictionaryLookupEnabled(false);
          await S.saveUiLanguage('fr');
          await S.saveExcludedDomains(['legacy.example']);
          await S.importData({
            words: { legacy: { meaning: 'old backup' } },
          });
          const words = await S.getWords();
          assert(words.legacy, 'expected imported legacy words');
          assertEqual(await S.getSourceLang(), 'fr');
          assertEqual(await S.getTranslationEngine(), 'browser');
          assertEqual(await S.getAutoTranslateOnSelect(), false);
          assertEqual(await S.getDictionaryLookupEnabled(), false);
          assertEqual(await S.getUiLanguage(), 'fr');
          assertEqual((await S.getExcludedDomains())[0], 'legacy.example');
        },
      },
      {
        name: 'getTranslationEngine defaults to online and saveTranslationEngine normalizes values',
        async run() {
          delete chrome.storage.local._store.translationEngine;
          delete chrome.storage.sync._store.translationEngine;
          assertEqual(await S.getTranslationEngine(), 'online');
          await S.saveTranslationEngine('browser');
          assertEqual(await S.getTranslationEngine(), 'browser');
          await S.saveTranslationEngine('unexpected');
          assertEqual(await S.getTranslationEngine(), 'online');
        },
      },
      {
        name: 'init hydrates translation engine from sync when local state is missing',
        async run() {
          delete chrome.storage.local._store.translationEngine;
          chrome.storage.sync._store.translationEngine = 'browser';
          assertEqual(await S.getTranslationEngine(), 'browser');
          assertEqual(chrome.storage.local._store.translationEngine, 'browser');
        },
      },
      {
        name: 'getUiLanguage falls back to browser language mapping',
        async run() {
          delete chrome.storage.local._store.uiLanguage;
          delete chrome.storage.sync._store.uiLanguage;
          const lang = await S.getUiLanguage();
          assertEqual(lang, 'fr');
        },
      },
      {
        name: 'saveExcludedDomains normalizes lowercase and trims empties',
        async run() {
          await S.saveExcludedDomains([' https://WWW.Google.com/path ', '', 'Chat.OpenAI.com']);
          const domains = await S.getExcludedDomains();
          assertEqual(domains[0], 'https://www.google.com/path');
          assertEqual(domains[1], 'chat.openai.com');
        },
      },
      {
        name: 'saveWords defers sync by default until flushSync is called',
        async run() {
          Object.keys(chrome.storage.local._store).forEach((key) => { delete chrome.storage.local._store[key]; });
          Object.keys(chrome.storage.sync._store).forEach((key) => { delete chrome.storage.sync._store[key]; });
          await S.saveWords({ deferred: { meaning: 'D' } });
          assertEqual(!!chrome.storage.sync._store.words_meta_v2, false);
          const syncState = await S.flushSync();
          assert(syncState && syncState.failed !== true, 'expected deferred sync to flush successfully');
          assert(chrome.storage.sync._store.words_meta_v2, 'expected sync metadata after flush');
        },
      },
      {
        name: 'saveWords immediate mode writes sync right away',
        async run() {
          Object.keys(chrome.storage.local._store).forEach((key) => { delete chrome.storage.local._store[key]; });
          Object.keys(chrome.storage.sync._store).forEach((key) => { delete chrome.storage.sync._store[key]; });
          const syncState = await S.saveWords({ immediate: { meaning: 'I' } }, { syncMode: 'immediate' });
          assert(syncState && syncState.failed !== true, 'expected immediate sync state');
          assert(chrome.storage.sync._store.words_meta_v2, 'expected sync metadata written immediately');
        },
      },
      {
        name: 'visibilitychange flushes deferred sync automatically',
        async run() {
          Object.keys(chrome.storage.local._store).forEach((key) => { delete chrome.storage.local._store[key]; });
          Object.keys(chrome.storage.sync._store).forEach((key) => { delete chrome.storage.sync._store[key]; });
          await S.saveWords({ hiddenFlush: { meaning: 'H' } });
          assertEqual(!!chrome.storage.sync._store.words_meta_v2, false);
          Object.defineProperty(document, 'visibilityState', { configurable: true, value: 'hidden' });
          document.dispatchEvent(new Event('visibilitychange'));
          await new Promise((resolve) => setTimeout(resolve, 0));
          assert(chrome.storage.sync._store.words_meta_v2, 'expected sync metadata after visibility flush');
        },
      },
      {
        name: 'pagehide flushes deferred sync automatically',
        async run() {
          Object.keys(chrome.storage.local._store).forEach((key) => { delete chrome.storage.local._store[key]; });
          Object.keys(chrome.storage.sync._store).forEach((key) => { delete chrome.storage.sync._store[key]; });
          await S.saveWords({ pagehideFlush: { meaning: 'P' } });
          assertEqual(!!chrome.storage.sync._store.words_meta_v2, false);
          window.dispatchEvent(new Event('pagehide'));
          await new Promise((resolve) => setTimeout(resolve, 0));
          assert(chrome.storage.sync._store.words_meta_v2, 'expected sync metadata after pagehide flush');
        },
      },
      {
        name: 'syncFromCloud merges remote words before writing back to sync',
        async run() {
          Object.keys(chrome.storage.local._store).forEach((key) => { delete chrome.storage.local._store[key]; });
          Object.keys(chrome.storage.sync._store).forEach((key) => { delete chrome.storage.sync._store[key]; });
          chrome.storage.local._store.words = {
            localOnly: { meaning: 'L', createdAt: 2 },
          };
          chrome.storage.sync._store.words = {
            remoteOnly: { meaning: 'R', createdAt: 1 },
          };
          const result = await S.syncFromCloud();
          const localWords = await S.getWords();
          assert(localWords.localOnly, 'expected local word kept');
          assert(localWords.remoteOnly, 'expected remote word merged into local');
          assertEqual(result.cloudWords, 1);
          assertEqual(result.totalWords, 2);
          assert(result.finalSyncState && result.finalSyncState.failed !== true, 'expected final sync state');
          assert(chrome.storage.sync._store.words_meta_v2, 'expected sync shards metadata written');
        },
      },
    ]);
  </script>
</body>
</html>
