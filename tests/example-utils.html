<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>example-utils</title>
</head>
<body>
  <pre id="test-output"></pre>
  <script src="../lib/sentence-splitter.js"></script>
  <script src="../lib/example-utils.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;
    const U = window.ExampleUtils;

    runTests([
      {
        name: "normalizeExampleEntry keeps translation/source metadata",
        run() {
          const item = U.normalizeExampleEntry({
            text: "  Hello world  ",
            pinned: true,
            createdAt: 10,
            pinnedAt: 20,
            translation: "你好世界",
            translatedAt: 30,
            sourceUrl: "https://example.com",
            capturedAt: 40,
          });
          assertEqual(item.text, "Hello world");
          assertEqual(item.pinned, true);
          assertEqual(item.translation, "你好世界");
          assertEqual(item.sourceUrl, "https://example.com");
          assertEqual(item.capturedAt, 40);
        },
      },
      {
        name: "sortExamples puts pinned first then newest first",
        run() {
          const sorted = U.sortExamples([
            { text: "b", pinned: false, createdAt: 10, pinnedAt: 0 },
            { text: "a", pinned: true, createdAt: 1, pinnedAt: 8 },
            { text: "c", pinned: true, createdAt: 2, pinnedAt: 3 },
          ]);
          assertEqual(sorted[0].text, "a");
          assertEqual(sorted[1].text, "c");
          assertEqual(sorted[2].text, "b");
        },
      },
      {
        name: "sortExamples ranks higher contextScore first among unpinned",
        run() {
          const sorted = U.sortExamples([
            { text: "low",  pinned: false, createdAt: 100, contextScore: 2.0 },
            { text: "high", pinned: false, createdAt: 100, contextScore: 5.5 },
            { text: "mid",  pinned: false, createdAt: 100, contextScore: 3.8 },
          ]);
          assertEqual(sorted[0].text, "high");
          assertEqual(sorted[1].text, "mid");
          assertEqual(sorted[2].text, "low");
        },
      },
      {
        name: "sortExamples: contextScore beats newer createdAt for unpinned",
        run() {
          const sorted = U.sortExamples([
            { text: "newer-but-worse", pinned: false, createdAt: 999, contextScore: 1.5 },
            { text: "older-but-better", pinned: false, createdAt: 1,   contextScore: 6.0 },
          ]);
          assertEqual(sorted[0].text, "older-but-better");
          assertEqual(sorted[1].text, "newer-but-worse");
        },
      },
      {
        name: "sortExamples: pinned items are unaffected by contextScore",
        run() {
          const sorted = U.sortExamples([
            { text: "pinned-low",  pinned: true,  pinnedAt: 5, contextScore: 1.0 },
            { text: "unpinned-high", pinned: false, createdAt: 1, contextScore: 9.0 },
            { text: "pinned-high", pinned: true,  pinnedAt: 10, contextScore: 9.0 },
          ]);
          assertEqual(sorted[0].text, "pinned-high");
          assertEqual(sorted[1].text, "pinned-low");
          assertEqual(sorted[2].text, "unpinned-high");
        },
      },
      {
        name: "sortExamples: entries without contextScore sort after scored entries",
        run() {
          const sorted = U.sortExamples([
            { text: "no-score",  pinned: false, createdAt: 100 },
            { text: "has-score", pinned: false, createdAt: 1,   contextScore: 3.0 },
          ]);
          assertEqual(sorted[0].text, "has-score");
          assertEqual(sorted[1].text, "no-score");
        },
      },
      {
        name: "enforceExampleLimit keeps pinned items outside unpinned cap",
        run() {
          const result = U.enforceExampleLimit([
            { text: "p1", pinned: true, createdAt: 1, pinnedAt: 1 },
            { text: "u3", pinned: false, createdAt: 3, pinnedAt: 0 },
            { text: "u2", pinned: false, createdAt: 2, pinnedAt: 0 },
            { text: "u1", pinned: false, createdAt: 1, pinnedAt: 0 },
          ], 2);
          assertEqual(result.length, 3);
          assertEqual(result[0].text, "p1");
        },
      },
      {
        name: "isLowInformationExample rejects bare word and url-like strings",
        run() {
          assertEqual(U.isLowInformationExample("run", "run"), true);
          assertEqual(U.isLowInformationExample("https://foo.bar/run", "run"), true);
          assertEqual(U.isLowInformationExample("I run every morning before work.", "run"), false);
        },
      },
      {
        name: "similarity and containment rules catch near-duplicate short titles",
        run() {
          assertEqual(U.hasContainmentRelation("Bincang Pinggiran 4", ["Bincang Pinggiran"]), true);
          assert(U.isTooSimilarToAny("Bincang Pinggiran 4", ["Bincang Pinggiran 3"], 0.88), "expected short-title similarity to be treated as duplicate");
        },
      },
      {
        name: "segmenter-backed tokenization and whole-word matching work for compact scripts",
        run() {
          const zhTokens = U.tokenizeForSimilarity("今天去圖書館學中文", "zh-TW");
          const jaMatch = U.findWholeWordMatch("今日は学校へ行きます。", "学校", "ja");
          const jaNoMatch = U.findWholeWordMatch("今日は小学校へ行きます。", "学校", "ja");
          assert(zhTokens.length >= 2, "expected zh tokenization to produce multiple tokens");
          assertEqual(!!jaMatch, true);
          assertEqual(jaMatch.index, 3);
          assertEqual(jaNoMatch, null);
        },
      },
      {
        name: "compact-script similarity and containment operate on segmented tokens",
        run() {
          assertEqual(U.hasContainmentRelation("今日は学校へ行きます", ["学校へ行きます"], "ja"), true);
          assertEqual(U.hasContainmentRelation("今日は小学校へ行きます", ["学校へ行きます"], "ja"), false);
          assert(U.isTooSimilarToAny("今日は学校へ行きます", ["明日は学校へ行きます"], 0.88, "ja"), "expected similar Japanese sentences to be treated as near-duplicates");
          assertEqual(U.isTooSimilarToAny("今日は図書館で勉強します", ["今日は学校へ行きます"], 0.88, "ja"), false);
        },
      },
      {
        name: "splitIntoSentences filters obvious code-like garbage",
        run() {
          const codey = "document.getElementById('x').addEventListener('click', function() { return 1; });";
          const normal = "This is a real sentence. This is another one.";
          assertEqual(U.splitIntoSentences(codey, "en").length, 0);
          assertEqual(U.splitIntoSentences(normal, "en").length >= 2, true);
        },
      },
      {
        name: "splitIntoSentences applies length limit to split sentences, not whole raw paragraph",
        run() {
          const longParagraph = "Pangkalpinang, InfoPublik - Kendati tidak ditemukan anak dengan kondisi stunting di Kelurahan Bacang Pangkalpinang, Penjabat (Pj) Gubernur Kepulauan Bangka Belitung (Kep. Babel) Suganda Pandapotan Pasaribu, meminta agar ibu hamil, dan orang tua dengan anak balita, untuk senantiasa memperhatikan asupan gizi.";
          const singleOverlongSentence = "A".repeat(281);
          const split = U.splitIntoSentences(longParagraph, "id");
          assertEqual(split.length >= 1, true);
          assertEqual(split.some((item) => item.includes("Kendati tidak ditemukan")), true);
          assertEqual(split.every((item) => U.isReasonableExampleSentence(item)), true);
          assertEqual(U.isReasonableExampleSentence(singleOverlongSentence), false);
          assertEqual(U.splitIntoSentences(singleOverlongSentence, "en").length, 0);
        },
      },
    ]);
  </script>
</body>
</html>
