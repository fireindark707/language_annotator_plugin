<html lang="en">
<head><meta charset="utf-8"><title>content-flow</title></head>

  <div id="fixture">running words stay visible</div>

  <script>
    const saveSnapshots = [];
    const tourCalls = [];
    const shownToasts = [];
    const runtimeMessages = [];
    let dictionaryLookupCalls = 0;
    let wordsState = { running: { meaning: '奔跑', learned: false, examples: [] } };
    Object.defineProperty(window.navigator, 'language', { configurable: true, value: 'ja-JP' });
    window.chrome = {
      runtime: {
        lastError: null,
        sendMessage(message, callback) {
          runtimeMessages.push(message);
          if (message.action === 'translateContextualWord') {
            if (message.word === 'delayedword') {
              window.setTimeout(() => {
                callback({ translation: '慢到但更准', method: 'Marker: HTML_u', usedContext: true, fallback: false });
              }, 250);
              return;
            }
            if (message.word === 'sameword') {
              window.setTimeout(() => {
                callback({ translation: '相同翻譯', method: 'Marker: HTML_u', usedContext: true, fallback: false });
              }, 180);
              return;
            }
            if (message.word === 'bank') {
              return callback({ translation: message.wordPos === 20 ? '河岸' : '银行', method: 'Marker: HTML_u', usedContext: true, fallback: false });
            }
            return callback({ translation: '语境:' + message.word, method: 'Marker: HTML_u', usedContext: true, fallback: false });
          }
          if (message.action === 'translate' && message.text === 'delayedword') {
            return callback({ translation: '快速普通翻譯' });
          }
          if (message.action === 'translate' && message.text === 'sameword') {
            return callback({ translation: '相同翻譯' });
          }
          if (message.action === 'translate') return callback({ translation: '翻譯:' + message.text });
          if (message.action === 'getLemma') {
            if (message.text === 'running') return callback({ found: true, lemma: 'run' });
            return callback({ found: true, lemma: message.text });
          }
          if (message.action === 'lookupDictionary') {
            dictionaryLookupCalls += 1;
            return callback({ found: true, source: 'dictionaryapi', query: 'running', lemma: 'run', usedLemma: false, sections: [{ mode: 'surface', query: 'running', source: 'dictionaryapi', entries: [{ pos: 'verb', definition: 'move fast' }] }, { mode: 'lemma', query: 'run', source: 'dictionaryapi', entries: [{ pos: 'verb', definition: 'move' }] }], entries: [{ pos: 'verb', definition: 'move fast' }] });
          }
          callback({});
        },
        onMessage: { addListener(fn) { window.__contentListener = fn; } },
      },
      i18n: { detectLanguage(_text, callback) { callback({ languages: [{ language: 'en', percentage: 100 }] }); } },
    };
    window.WordStorage = {
      getUiLanguage: () => Promise.resolve('en'),
      getAutoTranslateOnSelect: () => Promise.resolve(true),
      getExcludedDomains: () => Promise.resolve([]),
      getWords: () => Promise.resolve(JSON.parse(JSON.stringify(wordsState))),
      saveWords: (words) => { wordsState = JSON.parse(JSON.stringify(words)); saveSnapshots.push(wordsState); return Promise.resolve(); },
      getSourceLang: () => Promise.resolve('en'),
      getTranslationEngine: () => Promise.resolve('online'),
      getDictionaryLookupEnabled: () => Promise.resolve(true),
    };
    window.UiI18n = { t: (_lang, key) => key, langAttr: (lang) => lang || 'en', dir: () => 'ltr' };
    window.UiToast = { show(message, type) { shownToasts.push({ message, type }); } };
    window.UiTour = { start(opts) { tourCalls.push(opts.storageKey); }, maybeStartOnce(opts) { tourCalls.push(opts.storageKey); }, getSteps() { return []; }, getLabel() { return 'replay'; } };
    window.WordfreqUtils = {
      isSupported(lang) { return (lang || '').split('-')[0].toLowerCase() === 'en'; },
      initForLang() { return Promise.resolve(true); },
      getZipf(word) {
        const normalized = String(word || '').toLowerCase();
        if (normalized === 'the') return 7.0;
        return 0;
      },
      getDifficultyTier(zipf) {
        if (!zipf || zipf <= 0) return null;
        return zipf >= 5.3 ? 'A1' : 'C2';
      },
    };
    window.speechSynthesis = { getVoices() { return []; }, speak() {} };
    window.SpeechSynthesisUtterance = function SpeechSynthesisUtterance(text) { this.text = text; };
    window.IntersectionObserver = class { constructor(cb) { this.cb = cb; } observe(el) { this.cb([{ isIntersecting: true, target: el }], this); } unobserve() {} disconnect() {} };

    const { assert, assertEqual, runTests } = window.TestHarness;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function waitFor(condition, timeout = 600) {
      const startedAt = Date.now();
      while (Date.now() - startedAt < timeout) {
        if (condition()) return;
        await wait(20);
      }
      throw new Error('waitFor timeout');
    }

      {
        name: 'selection flow shows translation box with dictionary sections',
        async run() {
          tourCalls.length = 0;
          runtimeMessages.length = 0;
          const selection = window.getSelection();
          const host = document.createElement('p');
          const textNode = document.createTextNode('We keep running every morning.');
          host.appendChild(textNode);
          document.body.appendChild(host);
          const range = document.createRange();
          const start = textNode.nodeValue.indexOf('running');
          range.setStart(textNode, start);
          range.setEnd(textNode, start + 'running'.length);
          range.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });
          selection.removeAllRanges();
          selection.addRange(range);
          document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
          await wait(220);
          assert(document.getElementById('translationBox'), 'expected translation box');
          assert(document.getElementById('translationBox').textContent.includes('语境:running'), 'expected contextual word translation');
          assert(document.querySelector('#translationBox .la-translation-text').classList.contains('is-contextual'), 'expected contextual emphasis marker');
          assert(runtimeMessages.some((message) => message.action === 'translateContextualWord'), 'expected contextual translation message');
          assert(tourCalls.includes('content_selection_v1'), 'expected content selection tour on first translation box');
          assert(document.getElementById('translationDictionary').textContent.includes('dict_selected_form'), 'expected dictionary section label');
          host.remove();
          selection.removeAllRanges();
        },
      },

          document.body.appendChild(host);
          const textNode = host.firstChild;
          const firstIndex = textNode.nodeValue.indexOf('bank');
          const secondIndex = textNode.nodeValue.lastIndexOf('bank');

          const firstRange = document.createRange();
          firstRange.setStart(textNode, firstIndex);
          firstRange.setEnd(textNode, firstIndex + 4);
          firstRange.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 40, height: 10 });
          selection.removeAllRanges();
          selection.addRange(firstRange);
          await translateText('bank');
          await wait(80);

          secondRange.setEnd(textNode, secondIndex + 4);
          secondRange.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 40, height: 10 });
          selection.removeAllRanges();
          selection.addRange(secondRange);
          await translateText('bank');
          await wait(80);
          assert(document.getElementById('translationBox').textContent.includes('银行'), 'expected second bank to use finance meaning');

          const contextualCalls = runtimeMessages.filter((message) => message.action === 'translateContextualWord' && message.word === 'bank');
          assertEqual(contextualCalls.length >= 2, true);
          assertEqual(contextualCalls[0].wordPos !== contextualCalls[1].wordPos, true);
          host.remove();
          selection.removeAllRanges();
        },

            assertEqual(dictionaryLookupCalls, beforeLookups);
          } finally {
            Object.defineProperty(window.navigator, 'language', { configurable: true, value: originalNavigatorLanguage });
            window.WordStorage.getSourceLang = originalGetSourceLang;

        },
