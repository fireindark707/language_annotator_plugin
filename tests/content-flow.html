<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>content-flow</title></head>
<body>
  <div id="fixture">running words stay visible</div>
  <pre id="test-output"></pre>
  <script>
    const saveSnapshots = [];
    const tourCalls = [];
    const shownToasts = [];
    const runtimeMessages = [];
    let dictionaryLookupCalls = 0;
    let wordsState = { running: { meaning: '奔跑', learned: false, examples: [] } };
    Object.defineProperty(window.navigator, 'language', { configurable: true, value: 'ja-JP' });
    window.chrome = {
      runtime: {
        lastError: null,
        sendMessage(message, callback) {
          runtimeMessages.push(message);
          if (message.action === 'translate') return callback({ translation: '翻譯:' + message.text });
          if (message.action === 'getLemma') return callback({ found: true, lemma: 'run' });
          if (message.action === 'lookupDictionary') {
            dictionaryLookupCalls += 1;
            return callback({ found: true, source: 'dictionaryapi', query: 'running', lemma: 'run', usedLemma: false, sections: [{ mode: 'surface', query: 'running', source: 'dictionaryapi', entries: [{ pos: 'verb', definition: 'move fast' }] }, { mode: 'lemma', query: 'run', source: 'dictionaryapi', entries: [{ pos: 'verb', definition: 'move' }] }], entries: [{ pos: 'verb', definition: 'move fast' }] });
          }
          callback({});
        },
        onMessage: { addListener(fn) { window.__contentListener = fn; } },
      },
      i18n: { detectLanguage(_text, callback) { callback({ languages: [{ language: 'en', percentage: 100 }] }); } },
    };
    window.WordStorage = {
      getUiLanguage: () => Promise.resolve('en'),
      getAutoTranslateOnSelect: () => Promise.resolve(true),
      getExcludedDomains: () => Promise.resolve([]),
      getWords: () => Promise.resolve(JSON.parse(JSON.stringify(wordsState))),
      saveWords: (words) => { wordsState = JSON.parse(JSON.stringify(words)); saveSnapshots.push(wordsState); return Promise.resolve(); },
      getSourceLang: () => Promise.resolve('en'),
      getTranslationEngine: () => Promise.resolve('online'),
      getDictionaryLookupEnabled: () => Promise.resolve(true),
    };
    window.UiI18n = { t: (_lang, key) => key, langAttr: (lang) => lang || 'en', dir: () => 'ltr' };
    window.UiToast = { show(message, type) { shownToasts.push({ message, type }); } };
    window.UiTour = { start(opts) { tourCalls.push(opts.storageKey); }, maybeStartOnce(opts) { tourCalls.push(opts.storageKey); }, getSteps() { return []; }, getLabel() { return 'replay'; } };
    window.speechSynthesis = { getVoices() { return []; }, speak() {} };
    window.SpeechSynthesisUtterance = function SpeechSynthesisUtterance(text) { this.text = text; };
    window.IntersectionObserver = class { constructor(cb) { this.cb = cb; } observe(el) { this.cb([{ isIntersecting: true, target: el }], this); } unobserve() {} disconnect() {} };
  </script>
  <script src="../lib/dictionary-utils.js"></script>
  <script src="../lib/lemma-utils.js"></script>
  <script src="../lib/translation-utils.js"></script>
  <script src="../lib/sentence-splitter.js"></script>
  <script src="../lib/example-utils.js"></script>
  <script src="../lib/storage-merge-utils.js"></script>
  <script src="../lib/content-ui.js"></script>
  <script src="../lib/content-addword.js"></script>
  <script src="../lib/content-lookup-ui.js"></script>
  <script src="../lib/content-page-processing.js"></script>
  <script src="../content.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    runTests([
      {
        name: 'selection flow shows translation box with dictionary sections',
        async run() {
          tourCalls.length = 0;
          const selection = window.getSelection();
          const textNode = document.createTextNode('running');
          document.body.appendChild(textNode);
          const range = document.createRange();
          range.selectNodeContents(textNode);
          range.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });
          selection.removeAllRanges();
          selection.addRange(range);
          document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
          await wait(220);
          assert(document.getElementById('translationBox'), 'expected translation box');
          assert(tourCalls.includes('content_selection_v1'), 'expected content selection tour on first translation box');
          assert(document.getElementById('translationDictionary').textContent.includes('dict_selected_form'), 'expected dictionary section label');
          textNode.remove();
          selection.removeAllRanges();
        },
      },
      {
        name: 'runtime message opens add-word modal and save persists selected word',
        async run() {
          window.__contentListener({ action: 'openAddWordModal', word: 'running' }, null, function () {});
          await wait(80);
          const overlay = document.querySelector('.la-addword-overlay');
          assert(overlay, 'expected add-word modal');
          const input = overlay.querySelector('textarea');
          await wait(60);
          assert(input.value.includes('翻譯:running') || input.value.length > 0, 'expected prefilled meaning');
          overlay.querySelector('.la-addword-save').click();
          await wait(50);
          assert(saveSnapshots.length > 0, 'expected words saved');
          assert(wordsState.running, 'expected saved word record');
        },
      },
      {
        name: 'browser translation pair failure falls back online and shows user-facing reason',
        async run() {
          shownToasts.length = 0;
          const originalRequestPreferredTranslation = window.TranslationUtils.requestPreferredTranslation;
          window.TranslationUtils.requestPreferredTranslation = function requestPreferredTranslationStub(options) {
            if (options && typeof options.onBrowserFallback === 'function') {
              options.onBrowserFallback({ reason: 'pair_unavailable' });
            }
            return Promise.resolve('翻譯:fallback');
          };
          const existingBox = document.getElementById('translationBox');
          if (existingBox) existingBox.remove();
          await translateText('running quickly');
          await wait(60);
          const box = document.getElementById('translationBox');
          assert(box, 'expected translation box after online fallback');
          assert(box.textContent.includes('翻譯:fallback'), 'expected fallback translation');
          assert(shownToasts.some((item) => item.message === 'browser_translation_pair_unavailable' && item.type === 'error'), 'expected fallback reason toast');
          window.TranslationUtils.requestPreferredTranslation = originalRequestPreferredTranslation;
          box.remove();
        },
      },
      {
        name: 'highlightWords delegates to page processing and wraps stored word',
        async run() {
          wordsState = { running: { meaning: '奔跑', learned: false, examples: [] } };
          document.getElementById('fixture').textContent = 'running words stay visible';
          await window.highlightWords();
          assert(document.querySelector('.plugin-highlight-word'), 'expected highlighted word');
        },
      },
      {
        name: 'highlightWords uses browser language detection hint for compact-script matching',
        async run() {
          wordsState = { '学校': { meaning: 'school', learned: false, examples: [] } };
          document.querySelectorAll('.plugin-highlight-word').forEach((node) => {
            node.replaceWith(document.createTextNode(node.textContent || ''));
          });
          document.getElementById('fixture').textContent = '今日は学校へ行きます。今日は小学校にも寄ります。';
          const originalDetectLanguage = window.chrome.i18n.detectLanguage;
          if (typeof window.__resetContentLanguageHintForTests === 'function') {
            window.__resetContentLanguageHintForTests();
          }
          window.chrome.i18n.detectLanguage = (_text, callback) => {
            callback({ languages: [{ language: 'ja', percentage: 100 }] });
          };
          try {
            await window.highlightWords();
            await wait(80);
            const highlights = Array.from(document.getElementById('fixture').querySelectorAll('.plugin-highlight-word'));
            assertEqual(highlights.length, 1);
            assertEqual(highlights[0].textContent, '学校');
          } finally {
            window.chrome.i18n.detectLanguage = originalDetectLanguage;
          }
        },
      },
      {
        name: 'content language hint refreshes when body language changes on the same URL',
        async run() {
          const originalDetectLanguage = window.chrome.i18n.detectLanguage;
          document.getElementById('fixture').textContent = '今日は学校へ行きます。';
          if (typeof window.__resetContentLanguageHintForTests === 'function') {
            window.__resetContentLanguageHintForTests();
          }
          window.chrome.i18n.detectLanguage = (text, callback) => {
            if (String(text).includes('学校')) {
              callback({ languages: [{ language: 'ja', percentage: 100 }] });
              return;
            }
            callback({ languages: [{ language: 'en', percentage: 100 }] });
          };
          try {
            const first = await window.__resolveContentLanguageHintForTests();
            assertEqual(first, 'ja');
            document.getElementById('fixture').textContent = 'running words stay visible';
            const second = await window.__resolveContentLanguageHintForTests();
            assertEqual(second, 'en');
          } finally {
            window.chrome.i18n.detectLanguage = originalDetectLanguage;
          }
        },
      },
      {
        name: 'content translation flow does not treat compact-script sentences as dictionary queries',
        async run() {
          const originalNavigatorLanguage = window.navigator.language;
          const originalGetSourceLang = window.WordStorage.getSourceLang;
          const originalDetectLanguage = window.chrome.i18n.detectLanguage;
          const beforeLookups = dictionaryLookupCalls;
          Object.defineProperty(window.navigator, 'language', { configurable: true, value: 'en-US' });
          window.WordStorage.getSourceLang = () => Promise.resolve('ja');
          window.chrome.i18n.detectLanguage = (_text, callback) => {
            callback({ languages: [{ language: 'ja', percentage: 100 }] });
          };
          try {
            await translateText('今日は図書館に行きます');
            await wait(120);
            assertEqual(dictionaryLookupCalls, beforeLookups);
          } finally {
            Object.defineProperty(window.navigator, 'language', { configurable: true, value: originalNavigatorLanguage });
            window.WordStorage.getSourceLang = originalGetSourceLang;
            window.chrome.i18n.detectLanguage = originalDetectLanguage;
          }
        },
      },
    ]);
  </script>
</body>
</html>
