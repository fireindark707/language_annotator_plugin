<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>background-wiring</title></head>
<body>
  <pre id="test-output"></pre>
  <script>
    const createdMenus = [];
    const sentMessages = [];
    const installedListeners = [];
    const startupListeners = [];
    const clickListeners = [];
    const translationCalls = [];
    const initCalls = [];
    let contextualExtractCalls = 0;
    window.navigator.language = 'en-US';
    window.chrome = {
      runtime: {
        lastError: null,
        onInstalled: { addListener(fn) { installedListeners.push(fn); } },
        onStartup: { addListener(fn) { startupListeners.push(fn); } },
        onMessage: { addListener(fn) { window.__bgMessageListener = fn; } },
      },
      i18n: {
        detectLanguage(text, callback) {
          if (String(text).includes('river-bank-in-english')) {
            callback({ languages: [{ language: 'en', percentage: 100 }] });
            return;
          }
          callback({ languages: [{ language: 'zh-TW', percentage: 100 }] });
        },
      },
      contextMenus: {
        create(payload) { createdMenus.push(payload); },
        onClicked: { addListener(fn) { clickListeners.push(fn); } },
      },
      tabs: {
        sendMessage(tabId, payload, callback) { sentMessages.push({ tabId, payload }); callback && callback(); },
      },
    };
    window.importScripts = function importScripts() {};
    window.DictionaryUtils = {
      fetchJsonSafe() {},
      buildDictionaryLookup(query, sourceLang) {
        return {
          sourceName: sourceLang === 'ja' ? 'jotoba' : 'dictionaryapi',
          lookupPromise: Promise.resolve({ found: true, source: sourceLang === 'ja' ? 'jotoba' : 'dictionaryapi', entries: [{ definition: query }] }),
        };
      },
    };
    window.TranslationUtils = {
      normalizeTranslationLang(lang) {
        if (!lang) return "";
        return String(lang).trim();
      },
      isSameLanguageFamily(left, right) {
        const a = String(left || "").split("-")[0].toLowerCase();
        const b = String(right || "").split("-")[0].toLowerCase();
        return !!a && a === b;
      },
      getBrowserTargetLang() {
        return 'en-US';
      },
      translateWithGoogle(text, sourceLang, targetLang) {
        translationCalls.push({ text, sourceLang, targetLang });
        return Promise.resolve('translated:' + text);
      },
    };
    window.CleverTranslate = {
      ContextualTranslator: function ContextualTranslator() {
        this.extractWordTranslation = function (sentence, word, options) {
          contextualExtractCalls += 1;
          if (word === 'bank' && sentence.includes('river')) {
            if (sentence.includes('english')) {
              return Promise.resolve({ translation: 'river-bank-in-english', method: 'Marker: HTML_u', options });
            }
            return Promise.resolve({ translation: '河岸', method: 'Marker: HTML_u', options });
          }
          return Promise.resolve({ translation: '', method: 'Fallback: Empty' });
        };
      },
    };
    window.WordStorage = { init() { initCalls.push('init'); return Promise.resolve(); } };
    window.simplemma = {
      SUPPORTED_LANGUAGES: ['en', 'id', 'tl'],
      FetchDictionaryFactory: function FetchDictionaryFactory() {},
      DefaultStrategy: function DefaultStrategy() {},
      Lemmatizer: function Lemmatizer() {
        this.lemmatizeAsync = (text) => Promise.resolve(text === 'running' ? 'run' : text);
        this.getInflectionsAsync = (lemma) => Promise.resolve(lemma === 'run' ? ['run', 'runs', 'running', 'ran'] : [lemma]);
      },
    };
  </script>
  <script src="../lib/lemma-utils.js"></script>
  <script src="../background.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    runTests([
      {
        name: 'onInstalled wiring creates context menu and initializes storage',
        async run() {
          installedListeners[0]();
          await wait(0);
          assertEqual(createdMenus[0].id, 'addWord');
          assert(initCalls.length >= 1, 'expected storage init');
        },
      },
      {
        name: 'context menu click sends add-word modal message to tab',
        run() {
          clickListeners[0]({ menuItemId: 'addWord', selectionText: '  running ' }, { id: 9 });
          assertEqual(sentMessages[0].tabId, 9);
          assertEqual(sentMessages[0].payload.action, 'openAddWordModal');
          assertEqual(sentMessages[0].payload.word, 'running');
        },
      },
      {
        name: 'message listener handles translate, contextual translate, getLemma, getLemmaVariations, and lookupDictionary',
        async run() {
          const translateRes = await new Promise((resolve) => window.__bgMessageListener({ action: 'translate', text: 'hello', sourceLang: 'en', targetLang: 'zh-TW' }, null, resolve));
          assertEqual(translateRes.translation, 'translated:hello');
          const contextualRes = await new Promise((resolve) => window.__bgMessageListener({
            action: 'translateContextualWord',
            sentence: 'We sat on the river bank.',
            word: 'bank',
            wordPos: 20,
            sourceLang: 'en',
            targetLang: 'zh-TW',
          }, null, resolve));
          assertEqual(contextualRes.translation, '河岸');
          assertEqual(contextualRes.usedContext, true);
          assertEqual(contextualRes.fallback, false);
          const lemmaRes = await new Promise((resolve) => window.__bgMessageListener({ action: 'getLemma', text: 'running', sourceLang: 'en' }, null, resolve));
          assertEqual(lemmaRes.lemma, 'run');
          const variationRes = await new Promise((resolve) => window.__bgMessageListener({ action: 'getLemmaVariations', text: 'running', lemma: 'run', sourceLang: 'en' }, null, resolve));
          assert(variationRes.familyForms.includes('running'), 'expected family to include query form');
          assert(variationRes.familyForms.includes('ran'), 'expected family inflections');
          const dictRes = await new Promise((resolve) => window.__bgMessageListener({ action: 'lookupDictionary', text: 'running', sourceLang: 'en' }, null, resolve));
          assert(dictRes.found, 'expected dictionary result');
          assertEqual(Array.isArray(dictRes.sections), true);
          assertEqual(translationCalls.length > 0, true);
        },
      },
      {
        name: 'contextual translate falls back to google when clever translate has no hit',
        async run() {
          const beforeCalls = translationCalls.length;
          const response = await new Promise((resolve) => window.__bgMessageListener({
            action: 'translateContextualWord',
            sentence: 'The bank opens at nine.',
            word: 'bank',
            wordPos: 4,
            sourceLang: 'en',
            targetLang: 'zh-TW',
          }, null, resolve));
          assertEqual(response.translation, 'translated:bank');
          assertEqual(response.usedContext, false);
          assertEqual(response.fallback, true);
          assertEqual(translationCalls.length, beforeCalls + 1);
          assertEqual(translationCalls[translationCalls.length - 1].text, 'bank');
        },
      },
      {
        name: 'contextual translate falls back to google when clever result language mismatches target language',
        async run() {
          const beforeCalls = translationCalls.length;
          const response = await new Promise((resolve) => window.__bgMessageListener({
            action: 'translateContextualWord',
            sentence: 'We sat on the river bank in english.',
            word: 'bank',
            wordPos: 20,
            sourceLang: 'en',
            targetLang: 'zh-TW',
          }, null, resolve));
          assertEqual(response.translation, 'translated:bank');
          assertEqual(response.usedContext, false);
          assertEqual(response.fallback, true);
          assertEqual(response.method, 'Fallback: Target Language Mismatch');
          assertEqual(translationCalls.length, beforeCalls + 1);
        },
      },
      {
        name: 'contextual translate reuses cached result for identical requests',
        async run() {
          contextualExtractCalls = 0;
          const payload = {
            action: 'translateContextualWord',
            sentence: 'We camped by the river bank at sunset.',
            word: 'bank',
            wordPos: 24,
            sourceLang: 'en',
            targetLang: 'zh-TW',
          };
          const first = await new Promise((resolve) => window.__bgMessageListener(payload, null, resolve));
          const second = await new Promise((resolve) => window.__bgMessageListener(payload, null, resolve));
          assertEqual(first.translation, '河岸');
          assertEqual(second.translation, '河岸');
          assertEqual(contextualExtractCalls, 1);
        },
      },
    ]);
  </script>
</body>
</html>
