<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ui-i18n</title></head>
<body>
  <pre id="test-output"></pre>
  <script src="../ui-i18n.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;
    const UiI18nRef = window.UiI18n;
    const languages = ['zh-TW','zh-CN','en','fr','pt','ar','hi','ja','ko','id','ru','es'];
    const requiredKeys = [
      'popup_title',
      'settings',
      'sync_now',
      'practice_mode',
      'lemma_label',
      'dict_selected_form',
      'practice_show_translation',
      'translation_engine',
      'translation_engine_desc',
      'translation_engine_online',
      'translation_engine_browser',
      'browser_translation_quality_hint',
      'browser_translation_requires_manual_source',
      'browser_translation_same_language',
      'browser_translation_pair_unavailable',
      'browser_translation_requires_chrome',
      'browser_translation_failed',
    ];
    runTests([
      {
        name: 'all supported UI languages expose required core keys',
        run() {
          languages.forEach((lang) => {
            requiredKeys.forEach((key) => {
              const value = UiI18nRef.t(lang, key);
              assert(value && value !== key, `missing ${lang}:${key}`);
            });
          });
        },
      },
      {
        name: 'langAttr and dir map correctly',
        run() {
          assertEqual(UiI18nRef.langAttr('zh-TW'), 'zh-Hant');
          assertEqual(UiI18nRef.langAttr('zh-CN'), 'zh-Hans');
          assertEqual(UiI18nRef.dir('ar'), 'rtl');
          assertEqual(UiI18nRef.dir('en'), 'ltr');
        },
      },
      {
        name: 'unsupported locale falls back to english',
        run() {
          assertEqual(UiI18nRef.t('xx', 'settings'), UiI18nRef.t('en', 'settings'));
        },
      },
    ]);
  </script>
</body>
</html>
