<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>content-lookup-ui</title>
</head>
<body>
  <pre id="test-output"></pre>
  <script src="../lib/dictionary-utils.js"></script>
  <script src="../lib/translation-utils.js"></script>
  <script src="../lib/content-lookup-ui.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;
    const U = window.ContentLookupUi;
    window.speechSynthesis = {
      cancel() {},
      speak() {},
      getVoices() { return [{ lang: "en" }]; },
    };
    window.SpeechSynthesisUtterance = function SpeechSynthesisUtterance(text) {
      this.text = text;
      this.lang = "";
    };

    async function waitFor(condition, timeout = 1000) {
      const start = Date.now();
      while (Date.now() - start < timeout) {
        if (condition()) return;
        await new Promise((resolve) => setTimeout(resolve, 10));
      }
      throw new Error("waitFor timeout");
    }

    function createRuntime(handlers) {
      return {
        lastError: null,
        sendMessage(message, callback) {
          if (message.action === "translateContextualWord" && handlers.translateContextualWord) {
            callback(handlers.translateContextualWord(message));
            return;
          }
          if (message.action === "translate") {
            callback(handlers.translate(message));
            return;
          }
          callback({});
        },
      };
    }

    // ─── Mock WordfreqUtils for badge tests ──────────────────────────────────
    // Uses EN thresholds [5.3, 4.7, 4.2, 3.7, 3.2] for getDifficultyTier.
    const BADGE_FREQ = {
      "the":       7.0,  // A1
      "run":       5.0,  // A2
      "book":      4.5,  // B1
      "house":     4.1,  // B2
      "sorrow":    3.5,  // C1
      "parchment": 2.1,  // C2
      "running":   1.0,  // C2 — lemma "run" → A2(5.0)
    };
    function makeMockWordfreqUtils(freqTable) {
      const SUPPORTED = new Set(["en", "zh", "ja", "ko", "id", "fr", "de"]);
      return {
        isSupported(lang) { return SUPPORTED.has((lang || "").split("-")[0].toLowerCase()); },
        isReady(_lang) { return true; },
        initForLang(_lang) { return Promise.resolve(true); },
        getZipf(word, _lang) {
          const w = (word || "").toLowerCase();
          return (w in freqTable) ? freqTable[w] : 0;
        },
        getDifficultyTier(zipf, _lang) {
          if (!zipf || zipf <= 0) return null;
          if (zipf >= 5.3) return "A1";
          if (zipf >= 4.7) return "A2";
          if (zipf >= 4.2) return "B1";
          if (zipf >= 3.7) return "B2";
          if (zipf >= 3.2) return "C1";
          return "C2";
        },
      };
    }

    runTests([
      {
        name: "createPreviewHighlightedSentence highlights whole word matches",
        run() {
          const node = U.createPreviewHighlightedSentence("the running man", "running", {
            document,
            isCjkText: () => false,
            isBoundaryMatch: (text, start, end) => {
              const prev = start > 0 ? text[start - 1] : "";
              const next = end < text.length ? text[end] : "";
              return !/[A-Za-z0-9]/.test(prev) && !/[A-Za-z0-9]/.test(next);
            },
          });
          assert(node.querySelector("span"), "expected highlighted span");
          assertEqual(node.textContent, "the running man");
        },
      },
      {
        name: "createPreviewHighlightedSentence respects compact-script match boundaries",
        run() {
          const node = U.createPreviewHighlightedSentence("今日は学校へ行きます。今日は小学校にも寄ります。", "学校", {
            document,
            languageHint: "ja",
            isCjkText: () => false,
            isBoundaryMatch: () => false,
            findWholeWordMatch(text, word, _lang, fromIndex) {
              if (fromIndex > 0) return null;
              return text.startsWith("今日は学校", fromIndex) && word === "学校"
                ? { index: 3, length: 2 }
                : null;
            },
          });
          const marks = node.querySelectorAll("span");
          assertEqual(marks.length, 1);
          assertEqual(marks[0].textContent, "学校");
          assert(!node.textContent.includes("小学校") || !node.innerHTML.includes("<span>小学校</span>"), "expected no false-positive highlight inside 小学校");
        },
      },
      {
        name: "showTranslation creates translation box and appendDictionaryToTranslationBox renders sections",
        async run() {
          const sel = window.getSelection();
          const range = document.createRange();
          const textNode = document.createTextNode("sample");
          document.body.appendChild(textNode);
          range.selectNodeContents(textNode);
          sel.removeAllRanges();
          sel.addRange(range);
          range.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });

          const box = U.showTranslation("翻譯內容", { document });
          assert(box, "expected translation box");
          assertEqual(document.getElementById("translationBox").textContent.includes("翻譯內容"), true);
          assertEqual(document.getElementById("translationBox").querySelector("button"), null);

          U.appendDictionaryToTranslationBox({
            sections: [{
              mode: "surface",
              query: "running",
              source: "dictionaryapi",
              entries: [{ pos: "verb", definition: "to move quickly" }],
            }],
          }, "en", {
            document,
            DictionaryUtilsRef: window.DictionaryUtils,
            contentT(key) {
              return {
                dictionary: "Dictionary",
                no_dict_entries: "No entries",
                dict_selected_form: "Selected form",
                lemma_label: "Lemma",
              }[key] || key;
            },
            TranslationUtilsRef: window.TranslationUtils,
            chromeRuntime: createRuntime({
              translate: () => ({ translation: "快速移動" }),
            }),
            startContentSelectionTour() {},
            state: { contentSelectionTourAttempted: false },
          });
          await new Promise((resolve) => setTimeout(resolve, 0));
          const wrap = document.getElementById("translationDictionary");
          assertEqual(wrap.style.display, "block");
          assert(wrap.textContent.includes("Selected form: running"), "expected section title");
          assert(wrap.textContent.includes("快速移動"), "expected translated definition");
          box.remove();
          textNode.remove();
          sel.removeAllRanges();
        },
      },
      {
        name: "updateTranslationBox refreshes text and adds subtle refined state",
        run() {
          const sel = window.getSelection();
          const range = document.createRange();
          const textNode = document.createTextNode("sample");
          document.body.appendChild(textNode);
          range.selectNodeContents(textNode);
          sel.removeAllRanges();
          sel.addRange(range);
          range.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });

          const box = U.showTranslation("初始翻譯", { document });
          assert(box, "expected translation box");
          assertEqual(U.updateTranslationBox("語境更準", { document, isContextual: true }), true);
          assert(document.getElementById("translationBox").textContent.includes("語境更準"), "expected updated translation");
          assert(document.getElementById("translationBox").classList.contains("is-refined"), "expected refined state class");
          assert(document.querySelector(".la-translation-text").classList.contains("is-contextual"), "expected contextual emphasis class");
          box.remove();
          textNode.remove();
          sel.removeAllRanges();
        },
      },
      {
        name: "showTranslation marks contextual results with emphasis class",
        run() {
          const sel = window.getSelection();
          const range = document.createRange();
          const textNode = document.createTextNode("sample");
          document.body.appendChild(textNode);
          range.selectNodeContents(textNode);
          sel.removeAllRanges();
          sel.addRange(range);
          range.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });

          const box = U.showTranslation("語境譯文", { document, isContextual: true });
          assert(box, "expected translation box");
          assert(document.querySelector(".la-translation-text").classList.contains("is-contextual"), "expected contextual emphasis class");
          box.remove();
          textNode.remove();
          sel.removeAllRanges();
        },
      },
      {
        name: "showWordPreview renders meaning and translated examples",
        async run() {
          const anchor = document.createElement("span");
          anchor.textContent = "running";
          anchor.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });
          document.body.appendChild(anchor);
          U.showWordPreview(anchor, "meaning", [{ text: "running fast" }], {
            document,
            WordStorage: { getSourceLang: () => Promise.resolve("en") },
            chromeRuntime: createRuntime({
              translate: () => ({ translation: "快速奔跑" }),
            }),
            TranslationUtilsRef: window.TranslationUtils,
            contentT(key) {
              return {
                examples: "Examples",
                pronounce: "Pronounce",
              }[key] || key;
            },
            getExampleText(entry) {
              return entry.text;
            },
            isCjkText: () => false,
            isBoundaryMatch: () => true,
          });
          await waitFor(() => {
            const card = document.querySelector(".la-word-preview");
            return !!(card && card.textContent.includes("快速奔跑"));
          });
          const card = document.querySelector(".la-word-preview");
          assert(card, "expected preview card");
          const primaryWrap = card.querySelector(".la-word-preview-primary");
          assert(primaryWrap, "expected primary meaning block");
          assert(primaryWrap.textContent.includes("running"), "expected primary block label");
          assert(primaryWrap.textContent.includes("meaning"), "expected meaning");
          const exampleWrap = card.querySelector(".la-word-preview-example-block");
          assert(exampleWrap, "expected example block");
          assert(exampleWrap.textContent.includes("Examples"), "expected examples label");
          assertEqual(exampleWrap.querySelectorAll(".la-word-preview-example-item").length, 1);
          assert(exampleWrap.textContent.includes("快速奔跑"), "expected translated example");
          const audioButton = card.querySelector(".la-word-preview-audio");
          assert(audioButton, "expected pronounce button");
          assertEqual(audioButton.getAttribute("aria-label"), "Pronounce");
          U.hideWordPreview(0);
          await new Promise((resolve) => setTimeout(resolve, 10));
          anchor.remove();
        },
      },
      {
        name: "showWordPreview family mode shows current-form translation and dictionary, with saved root info below",
        async run() {
          const contextualMessages = [];
          const anchor = document.createElement("span");
          anchor.textContent = "running";
          anchor.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });
          document.body.appendChild(anchor);
          U.showWordPreview(anchor, {
            mode: "family",
            currentForm: "running",
            rootWord: "run",
            rootMeaning: "move fast",
            contextSentence: "We are running fast today.",
            contextWordPos: 7,
            examples: [],
          }, {
            document,
            WordStorage: { getSourceLang: () => Promise.resolve("en") },
            chromeRuntime: {
              lastError: null,
              sendMessage(message, callback) {
                if (message.action === "translateContextualWord") {
                  contextualMessages.push(message);
                  callback({
                    translation: "按语境是奔跑中",
                    method: "Marker: HTML_u",
                    usedContext: true,
                    fallback: false,
                  });
                  return;
                }
                if (message.action === "translate") {
                  callback({
                    translation: message.text === "moving quickly" ? "快速移動中" : "正在跑",
                  });
                  return;
                }
                if (message.action === "lookupDictionary") {
                  callback({
                    found: true,
                    sections: [{
                      mode: "surface",
                      query: "running",
                      source: "dictionaryapi",
                      entries: [{ definition: "moving quickly", definitionTranslated: "快速移動中" }],
                    }, {
                      mode: "lemma",
                      query: "run",
                      source: "dictionaryapi",
                      entries: [{ definition: "to move fast", definitionTranslated: "快速移動" }],
                    }],
                  });
                  return;
                }
                callback({});
              },
            },
            TranslationUtilsRef: window.TranslationUtils,
            DictionaryUtilsRef: window.DictionaryUtils,
            normalizeDictionaryQuery: window.DictionaryUtils.normalizeDictionaryQuery,
            shouldLookupDictionaryQuery: window.DictionaryUtils.shouldLookupDictionaryQuery,
            supportsDictionaryBySourceLang: window.DictionaryUtils.supportsDictionaryBySourceLang,
            contentT(key) {
              return {
                dict_selected_form: "Selected form",
                local_saved_words: "Saved word",
                dictionary: "Dictionary",
                no_dict_entries: "No entries",
                examples: "Examples",
                pronounce: "Pronounce",
              }[key] || key;
            },
            getExampleText(entry) {
              return entry.text;
            },
            isCjkText: () => false,
            isBoundaryMatch: () => true,
            detectLanguage(text) {
              if (text === "We are running fast today.") return Promise.resolve("en");
              return Promise.resolve("");
            },
          });
          await waitFor(() => {
            const card = document.querySelector(".la-word-preview");
            return !!(card && card.textContent.includes("按语境是奔跑中") && card.textContent.includes("快速移動中"));
          });
          const card = document.querySelector(".la-word-preview");
          assert(card, "expected preview card");
          const currentWrap = card.querySelector(".la-word-preview-family-current");
          assert(currentWrap, "expected current-form block");
          assert(currentWrap.textContent.includes("running"), "expected current-form block label");
          const familyAudioButton = currentWrap.querySelector(".la-word-preview-audio");
          assert(familyAudioButton, "expected family pronounce button");
          assertEqual(familyAudioButton.getAttribute("aria-label"), "Pronounce");
          assert(!card.textContent.startsWith("Selected form: running"), "preview should not repeat current-form title above the content");
          assert(card.textContent.includes("按语境是奔跑中"), "expected contextual current-form translation");
          assert(card.textContent.includes("Dictionary"), "expected dictionary section");
          assert(card.textContent.includes("快速移動中"), "expected translated dictionary definition");
          assert(!card.textContent.includes("Lemma: run"), "family preview should not render lemma dictionary section");
          const dictWrap = card.querySelector(".la-word-preview-dict");
          assert(dictWrap, "expected preview dictionary wrapper");
          assert(dictWrap.textContent.includes("Selected form: running · Free Dictionary"), "expected surface dictionary section title");
          assert(dictWrap.textContent.includes("[") || dictWrap.textContent.includes("快速移動中"), "expected dictionary entry structure");
          assertEqual(contextualMessages[0].sourceLang, "en");
          const noteWrap = card.querySelector(".la-word-preview-note");
          assert(noteWrap, "expected saved-word block");
          assert(noteWrap.textContent.includes("Saved word"), "expected saved-word label");
          assert(noteWrap.textContent.includes("run · move fast"), "expected saved root info");
          U.hideWordPreview(0);
          await new Promise((resolve) => setTimeout(resolve, 10));
          anchor.remove();
        },
      },

      // ═══ Zipf badge — showWordPreview ══════════════════════════════════════

      {
        name: "showWordPreview renders A1 zipf badge for common word",
        async run() {
          const wfu = makeMockWordfreqUtils(BADGE_FREQ);
          const anchor = document.createElement("span");
          anchor.textContent = "the";
          anchor.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });
          document.body.appendChild(anchor);
          U.showWordPreview(anchor, "article", [], {
            document,
            WordStorage: { getSourceLang: () => Promise.resolve("en") },
            WordfreqUtils: wfu,
            chromeRuntime: { lastError: null, sendMessage(_, cb) { cb({}); } },
            TranslationUtilsRef: window.TranslationUtils,
            contentT(key) { return { examples: "Examples", pronounce: "Pronounce" }[key] || key; },
            getExampleText(e) { return e.text || ""; },
            isCjkText: () => false,
            isBoundaryMatch: () => true,
          });
          await waitFor(() => !!document.querySelector(".la-zipf-badge--A1"));
          const badge = document.querySelector(".la-zipf-badge--A1");
          assert(badge, "expected A1 badge");
          assertEqual(badge.textContent, "A1");
          U.hideWordPreview(0);
          await new Promise((r) => setTimeout(r, 10));
          anchor.remove();
        },
      },

      {
        name: "showWordPreview renders C2 zipf badge for rare word",
        async run() {
          const wfu = makeMockWordfreqUtils(BADGE_FREQ);
          const anchor = document.createElement("span");
          anchor.textContent = "parchment";
          anchor.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });
          document.body.appendChild(anchor);
          U.showWordPreview(anchor, "old writing material", [], {
            document,
            WordStorage: { getSourceLang: () => Promise.resolve("en") },
            WordfreqUtils: wfu,
            chromeRuntime: { lastError: null, sendMessage(_, cb) { cb({}); } },
            TranslationUtilsRef: window.TranslationUtils,
            contentT(key) { return { examples: "Examples", pronounce: "Pronounce" }[key] || key; },
            getExampleText(e) { return e.text || ""; },
            isCjkText: () => false,
            isBoundaryMatch: () => true,
          });
          await waitFor(() => !!document.querySelector(".la-zipf-badge--C2"));
          const badge = document.querySelector(".la-zipf-badge--C2");
          assert(badge, "expected C2 badge");
          assertEqual(badge.textContent, "C2");
          assert(badge.title.includes("2.1"), "expected title to include zipf score 2.1");
          U.hideWordPreview(0);
          await new Promise((r) => setTimeout(r, 10));
          anchor.remove();
        },
      },

      {
        name: "showWordPreview shows no zipf badge when WordfreqUtils is absent",
        async run() {
          const anchor = document.createElement("span");
          anchor.textContent = "book";
          anchor.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });
          document.body.appendChild(anchor);
          U.showWordPreview(anchor, "a reading item", [], {
            document,
            WordStorage: { getSourceLang: () => Promise.resolve("en") },
            // WordfreqUtils intentionally omitted
            chromeRuntime: { lastError: null, sendMessage(_, cb) { cb({}); } },
            TranslationUtilsRef: window.TranslationUtils,
            contentT(key) { return { examples: "Examples", pronounce: "Pronounce" }[key] || key; },
            getExampleText(e) { return e.text || ""; },
            isCjkText: () => false,
            isBoundaryMatch: () => true,
          });
          await new Promise((r) => setTimeout(r, 80));
          const badge = document.querySelector(".la-zipf-badge");
          assert(!badge, "expected no zipf badge when WordfreqUtils absent");
          U.hideWordPreview(0);
          await new Promise((r) => setTimeout(r, 10));
          anchor.remove();
        },
      },

      // ═══ Zipf badge — showTranslation ══════════════════════════════════════

      {
        name: "showTranslation renders B1 zipf badge for source word",
        async run() {
          const wfu = makeMockWordfreqUtils(BADGE_FREQ);
          const sel = window.getSelection();
          const range = document.createRange();
          const textNode = document.createTextNode("book");
          document.body.appendChild(textNode);
          range.selectNodeContents(textNode);
          sel.removeAllRanges();
          sel.addRange(range);
          range.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });
          U.showTranslation("書", {
            document,
            WordfreqUtils: wfu,
            sourceWord: "book",
            sourceLang: "en",
            startContentSelectionTour() {},
            state: { contentSelectionTourAttempted: false },
          });
          await waitFor(() => !!document.querySelector(".la-zipf-badge--B1"));
          const badge = document.querySelector(".la-zipf-badge--B1");
          assert(badge, "expected B1 badge on translation card");
          assertEqual(badge.textContent, "B1");
          assert(badge.title.includes("4.5"), "expected title to include zipf score 4.5");
          document.getElementById("translationBox").remove();
          textNode.remove();
          sel.removeAllRanges();
        },
      },

      {
        name: "showTranslation badge upgrades via lemma for C2 inflected word",
        async run() {
          const wfu = makeMockWordfreqUtils(BADGE_FREQ);
          // "running" is C2(1.0); lemma "run" is A2(5.0) → badge should upgrade to A2
          const sel = window.getSelection();
          const range = document.createRange();
          const textNode = document.createTextNode("running");
          document.body.appendChild(textNode);
          range.selectNodeContents(textNode);
          sel.removeAllRanges();
          sel.addRange(range);
          range.getBoundingClientRect = () => ({ left: 10, top: 10, bottom: 20, width: 50, height: 10 });
          const chromeRuntime = {
            lastError: null,
            sendMessage(message, callback) {
              if (message.action === "getLemma") {
                callback({ found: true, lemma: "run" });
                return;
              }
              callback({});
            },
          };
          U.showTranslation("跑步", {
            document,
            WordfreqUtils: wfu,
            sourceWord: "running",
            sourceLang: "en",
            chromeRuntime,
            startContentSelectionTour() {},
            state: { contentSelectionTourAttempted: false },
          });
          // Wait for badge to upgrade from C2 to A2
          await waitFor(() => !!document.querySelector(".la-zipf-badge--A2"), 1500);
          const badge = document.querySelector(".la-zipf-badge--A2");
          assert(badge, "expected badge to upgrade to A2 via lemma lookup");
          assertEqual(badge.textContent, "A2");
          document.getElementById("translationBox").remove();
          textNode.remove();
          sel.removeAllRanges();
        },
      },
    ]);
  </script>
</body>
</html>
