<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sentence-splitter</title>
</head>
<body>
  <pre id="test-output"></pre>
  <script src="../lib/sentence-splitter.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;
    const U = window.SentenceSplitter;

    runTests([
      {
        name: "normalizeLanguage folds regional variants into supported bases",
        run() {
          assertEqual(U.normalizeLanguage("id-ID"), "id");
          assertEqual(U.normalizeLanguage("ja-JP"), "ja");
          assertEqual(U.normalizeLanguage("zh-TW"), "zh");
          assertEqual(U.normalizeLanguage("pt-BR"), "pt");
        },
      },
      {
        name: "splitIntoSentences caches fallback results by normalized text and language",
        run() {
          U.__resetForTests();
          let fallbackCalls = 0;
          const first = U.splitIntoSentences("Fallback path example.", "en", (normalized) => {
            fallbackCalls += 1;
            return [normalized, "extra"];
          });
          const second = U.splitIntoSentences("Fallback   path example.", "en", () => {
            fallbackCalls += 1;
            return ["should not run"];
          });
          assertEqual(fallbackCalls, 1);
          assertEqual(first.length, 2);
          assertEqual(second.length, 2);
          assertEqual(second[1], "extra");
        },
      },
      {
        name: "repairSegments merges abbreviation-driven false splits",
        run() {
          U.__resetForTests();
          const repairedEs = U.repairSegments([
            "El Sr.",
            "Gómez llegó temprano.",
            "Luego habló con todos.",
          ], "es");
          const repairedJa = U.repairSegments([
            "これはA.",
            "I.技術の説明です。",
            "次の文です。",
          ], "ja");
          assertEqual(repairedEs.length, 2);
          assertEqual(repairedEs[0], "El Sr. Gómez llegó temprano.");
          assertEqual(repairedJa.length, 2);
          assertEqual(repairedJa[0], "これはA.I.技術の説明です。");
        },
      },
      {
        name: "repairSegments does not merge uppercase time-zone abbreviations into the next sentence",
        run() {
          U.__resetForTests();
          const repaired = U.repairSegments([
            "Sebagai informasi, jenazah tiba sekitar pukul 18.00 WIB.",
            "Pesawat yang membawa mereka mendarat di apron.",
          ], "id");
          assertEqual(repaired.length, 2);
          assertEqual(repaired[0], "Sebagai informasi, jenazah tiba sekitar pukul 18.00 WIB.");
          assertEqual(repaired[1], "Pesawat yang membawa mereka mendarat di apron.");
        },
      },
      {
        name: "splitIntoSentences uses mocked sentencex api and repairs its output",
        run() {
          U.__resetForTests();
          U.__setApiForTests({
            segment(lang, text) {
              assertEqual(lang, "de");
              assertEqual(text, "Viele Geräte, z. B. Sensoren, profitieren davon. Danach folgt der Test.");
              return [
                "Viele Geräte, z.",
                "B. Sensoren, profitieren davon.",
                "Danach folgt der Test.",
              ];
            },
          });
          const result = U.splitIntoSentences(
            "Viele Geräte, z. B. Sensoren, profitieren davon. Danach folgt der Test.",
            "de",
            () => {
              throw new Error("fallback should not run");
            }
          );
          assertEqual(result.length, 2);
          assertEqual(result[0], "Viele Geräte, z.B. Sensoren, profitieren davon.");
          assertEqual(result[1], "Danach folgt der Test.");
        },
      },
      {
        name: "splitIntoSentences falls back when mocked sentencex api throws",
        run() {
          U.__resetForTests();
          U.__setApiForTests({
            segment() {
              throw new Error("boom");
            },
          });
          let fallbackCalls = 0;
          const result = U.splitIntoSentences("これはテストです。次の文です。", "ja", (normalized, lang) => {
            fallbackCalls += 1;
            assertEqual(lang, "ja");
            return normalized.split("。").filter(Boolean).map((item) => `${item}。`);
          });
          assertEqual(fallbackCalls, 1);
          assertEqual(result.length, 2);
          assertEqual(result[0], "これはテストです。");
          assertEqual(result[1], "次の文です。");
        },
      },
      {
        name: "splitIntoSentences caches mocked api results until reset",
        run() {
          U.__resetForTests();
          let calls = 0;
          U.__setApiForTests({
            segment() {
              calls += 1;
              return ["Alpha.", "Beta."];
            },
          });
          const first = U.splitIntoSentences("Alpha. Beta.", "en", () => []);
          const second = U.splitIntoSentences("Alpha. Beta.", "en", () => []);
          assertEqual(calls, 1);
          assertEqual(first.length, 2);
          assertEqual(second.length, 2);
        },
      },
      // ── isExtensionPage / content-script WASM guard ───────────────────────
      {
        name: "sentence splitter: http page skips WASM init and uses fallback immediately",
        run() {
          // The test harness runs on a chrome-extension:// page, so we can't
          // directly test http: protocol here.  Instead verify the observable
          // contract: after __resetForTests (initFailed=false), splitIntoSentences
          // with no mocked API returns the fallback result synchronously.
          U.__resetForTests();
          const result = U.splitIntoSentences("Hello world. Foo bar.", "en", (text) => [text]);
          // Must return at least the full text as one fallback sentence
          assert(result.length >= 1, "fallback must return at least 1 segment");
          assert(result.join(" ").includes("Hello world"), "fallback text preserved");
        },
      },
      {
        name: "sentence splitter: initFailed=true after non-extension page → subsequent calls use fallback without retry",
        run() {
          U.__resetForTests();
          // Simulate what happens after isExtensionPage()=false sets initFailed
          // by using __setApiForTests(null) then manually checking fallback behaviour
          let fallbackCalls = 0;
          U.__setApiForTests(null);
          // With no api and initFailed, every call returns fallback
          const r1 = U.splitIntoSentences("Sentence one. Sentence two.", "en", (t) => { fallbackCalls++; return [t]; });
          const r2 = U.splitIntoSentences("Another sentence.", "en", (t) => { fallbackCalls++; return [t]; });
          assertEqual(fallbackCalls, 2, "fallback called for each unique input");
          assert(r1.length >= 1, "r1 has result");
          assert(r2.length >= 1, "r2 has result");
        },
      },
    ]);
  </script>
</body>
</html>
