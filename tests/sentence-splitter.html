<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sentence-splitter</title>
</head>
<body>
  <pre id="test-output"></pre>
  <script>
    const runtimeOrigin = window.location.origin;
    window.chrome = {
      runtime: {
        getURL(path) {
          return `${runtimeOrigin}/${path}`;
        },
      },
    };
  </script>
  <script src="../lib/sentence-splitter.js"></script>
  <script>
    const results = [];

    function record(status, name, detail) {
      results.push(`${status}: ${name}${detail ? ` :: ${detail}` : ""}`);
    }

    function assertEqual(actual, expected, name) {
      if (actual !== expected) {
        throw new Error(`${name} | actual=${JSON.stringify(actual)} expected=${JSON.stringify(expected)}`);
      }
    }

    function assertContainsIgnoringSpaces(text, expected, name) {
      const actualNormalized = String(text || "").replace(/\s+/g, "");
      const expectedNormalized = String(expected || "").replace(/\s+/g, "");
      if (!actualNormalized.includes(expectedNormalized)) {
        throw new Error(`${name} | actual=${JSON.stringify(text)} expected~=${JSON.stringify(expected)}`);
      }
    }

    function flush(failed) {
      const output = document.getElementById("test-output");
      output.textContent = results.join("\n");
      const summary = document.createElement("div");
      summary.id = "test-summary";
      summary.textContent = failed ? "TEST_FAIL" : "TEST_PASS";
      document.body.appendChild(summary);
    }

    (async () => {
      let failed = false;
      const tests = [
        async function testInit() {
          const api = await window.SentenceSplitter.init();
          assertEqual(!!api, true, "sentence splitter initializes");
        },
        async function testUsesRuntimeModuleUrl() {
          const normalized = window.SentenceSplitter.normalizeLanguage("id-ID");
          assertEqual(normalized, "id", "language normalization stays intact");
          const api = await window.SentenceSplitter.init();
          assertEqual(!!api, true, "runtime getURL path loads sentencex module");
        },
        async function testIndonesianKep() {
          const text = "Pangkalpinang, InfoPublik - Kendati tidak ditemukan anak dengan kondisi stunting di Kelurahan Bacang Pangkalpinang, Penjabat (Pj) Gubernur Kepulauan Bangka Belitung (Kep. Babel) Suganda Pandapotan Pasaribu, meminta agar ibu hamil, dan orang tua dengan anak balita, untuk senantiasa memperhatikan asupan gizi.";
          const result = window.SentenceSplitter.splitIntoSentences(text, "id", () => []);
          assertEqual(result.length, 1, "indonesian Kep abbreviation stays in one sentence");
          assertEqual(result[0].includes("(Kep. Babel)"), true, "indonesian keeps Kep. Babel");
        },
        async function testSpanishHonorific() {
          const text = "El Sr. Gómez llegó temprano. Luego habló con todos.";
          const result = window.SentenceSplitter.splitIntoSentences(text, "es", () => []);
          assertEqual(result.length, 2, "spanish honorific count");
          assertEqual(result[0].includes("Sr. Gómez"), true, "spanish honorific content");
        },
        async function testGermanAbbreviation() {
          const text = "Viele Geräte, z. B. Sensoren, profitieren davon. Danach folgt der Test.";
          const result = window.SentenceSplitter.splitIntoSentences(text, "de", () => []);
          assertEqual(result.length, 2, "german z. B. count");
          assertContainsIgnoringSpaces(result[0], "z. B. Sensoren", "german z. B. content");
        },
        async function testJapaneseAcronym() {
          const text = "これはA.I.技術の説明です。次の文です。";
          const result = window.SentenceSplitter.splitIntoSentences(text, "ja", () => []);
          assertEqual(result.length, 2, "japanese A.I. count");
          assertContainsIgnoringSpaces(result[0], "A.I.技術", "japanese A.I. content");
        },
      ];

      for (const testFn of tests) {
        try {
          await testFn();
          record("PASS", testFn.name);
        } catch (error) {
          failed = true;
          record("FAIL", testFn.name, error && error.message ? error.message : String(error));
        }
      }

      flush(failed);
    })().catch((error) => {
      record("FAIL", "sentence-splitter bootstrap", error && error.message ? error.message : String(error));
      flush(true);
    });
  </script>
</body>
</html>
