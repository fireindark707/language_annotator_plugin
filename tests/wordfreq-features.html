<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>wordfreq-features</title>
</head>
<body>
  <pre id="test-output"></pre>

  <!-- Required dependencies for content-difficulty.js and content-page-processing.js -->
  <script src="../lib/sentence-splitter.js"></script>
  <script src="../lib/example-utils.js"></script>
  <script src="../lib/wordfreq-utils.js"></script>
  <script src="../lib/content-difficulty.js"></script>
  <script src="../lib/content-page-processing.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;

    // ─── Mock WordfreqLib ─────────────────────────────────────────────────────
    // Provides a deterministic in-memory word frequency table used across all tests.
    // Format: word -> zipf score
    const MOCK_FREQ = {
      // EN thresholds: A1≥5.3, A2≥4.7, B1≥4.2, B2≥3.7, C1≥3.2
      // English A1 (≥5.3)
      "the": 7.0, "is": 6.8, "and": 6.9, "to": 6.7, "in": 6.5, "a": 7.1, "of": 6.6,
      "it": 6.3, "he": 6.1, "she": 6.0, "they": 5.8, "we": 5.7, "you": 5.9,
      "was": 6.2, "are": 6.4, "has": 6.0, "have": 6.1, "had": 6.2, "be": 6.0,
      // English A2 (≥4.7)
      "year": 4.9, "people": 4.8,
      // English B1 (≥4.2): book/water/city/read are all B1 for EN
      "book": 4.5, "city": 4.3, "water": 4.6, "read": 4.4, "learn": 4.2,
      // English B2 (≥3.7): house(4.1) is B2 for EN (< B1 threshold 4.2)
      "house": 4.1, "ponder": 3.8, "wander": 3.7,
      // English C1 (≥3.2)
      "sorrow": 3.5, "gloom": 3.2,
      // English C2 (<3.2)
      "parchment": 2.1, "lexicon": 2.3, "breviary": 2.8, "codex": 2.0,
      "folio": 2.2, "epistle": 1.9, "palimpsest": 1.5, "quire": 1.7,
      "zymurgy": 0.5, "pogonology": 0.4, "tmesis": 0.6, "anfractuous": 0.3,
      // Inflected forms (C2) paired with their common lemmas — for lemma-aware scoring tests
      // EN thresholds: A1≥5.3, A2≥4.7, B1≥4.2, B2≥3.7, C1≥3.2, C2<3.2
      "running": 1.0,   // C2 — lemma "run" is A2(5.0)
      "run": 5.0,       // A2
      "writings": 1.8,  // C2 — lemma "write" is A2(4.8)
      "write": 4.8,     // A2
      "sorrows": 2.9,   // C2 — lemma "sorrow" is C1(3.5)
      "wandered": 2.5,  // C2 — lemma "wander" is B2(3.7)
      // Indonesian (id) — thresholds [5.4,4.7,4.2,3.8,3.3]
      // A1 (≥5.4): common function words + lemmas
      "yang": 7.0, "dan": 6.8, "ini": 6.5, "itu": 6.6, "ada": 6.4,
      "bisa": 5.5,     // A1 — lemma of "sebisanya"
      "tidak": 6.7, "dengan": 6.9, "untuk": 6.6,
      "bangun": 5.6,   // A1 — lemma of "dibangunkan"
      // C2 (<3.3): inflected forms whose lemmas are A1
      "dibangunkan": 1.8,  // C2 — lemma "bangun" is A1
      "sebisanya": 2.0,    // C2 — lemma "bisa" is A1
      // Chinese (zh) — single chars have varying freq
      "的": 7.5, "是": 7.2, "在": 7.0, "了": 7.3, "我": 6.8, "他": 6.9,
      "学": 5.2, "习": 5.0, "中": 6.0, "国": 5.8,
      "词": 3.5, "频": 3.2, "率": 3.8,
      "璎": 1.2, "珞": 1.1, "琮": 0.9,
      // Japanese (ja)
      "の": 7.5, "は": 7.3, "が": 7.1, "で": 7.0, "に": 7.2,
      "語": 5.0, "言": 5.1, "学": 5.2, "校": 4.8,
      "璧": 1.0,
      // Korean (ko)
      "이": 7.0, "가": 6.8, "의": 7.1, "를": 6.9,
      "학": 5.0, "교": 4.9, "어": 5.1,
      // Thai (th)
      "ใน": 6.5, "และ": 6.3, "ของ": 6.4,
    };

    // Simulates the BrowserDataFetcher + Wordfreq instances; init is instant (no network).
    function makeMockWordfreqLib() {
      function BrowserDataFetcher() {}
      function Wordfreq(lang) {
        this._lang = lang;
      }
      Wordfreq.prototype.init = function () { return Promise.resolve(); };
      Wordfreq.prototype.zipfFrequency = function (word) {
        const w = (word || "").toLowerCase();
        return (w in MOCK_FREQ) ? MOCK_FREQ[w] : 0;
      };
      return { Wordfreq, BrowserDataFetcher };
    }

    // Install mock library before each test group that needs it.
    function installMockLib() {
      globalThis.WordfreqLib = makeMockWordfreqLib();
    }
    function uninstallMockLib() {
      delete globalThis.WordfreqLib;
    }

    // ─── WordfreqUtils Unit Tests ─────────────────────────────────────────────
    const WFU = window.WordfreqUtils;

    // ─── ContentDifficulty Unit Tests ─────────────────────────────────────────
    const CD = window.ContentDifficulty;

    // ─── ContentPageProcessing Unit Tests ────────────────────────────────────
    const CPP = window.ContentPageProcessing;

    // ─── Section 11 helpers (analyzeAndShow + getLemma) ───────────────────────
    // Each test uses document.implementation.createHTMLDocument() for full isolation.
    // Token-count math for EN (minLen=3, threshold=0.90):
    //   A1 (≥3 chars): the,and,was,she,they,you,have,had,are  (9 total)
    //   C2:            parchment,lexicon,breviary,folio,codex  (5 total)
    //   Non-mock pad:  this,sentence,just,padding,that,text,
    //                  exceeds,hundred,characters,minimum,content (11 total)
    //   → 25 unique tokens ≥ 20 guard; text ≈ 130 chars ≥ 100 guard
    //   → scored = 9 A1 + C2_count; through C1 = 9/scored

    // 9 A1 + 5 C2 → scored=14, 9/14=64% < 90% → C2
    const C2_ARTICLE = [
      "the and was she they you have had are",
      "parchment lexicon breviary folio codex",
      "this sentence just padding that text exceeds hundred characters minimum content",
    ].join(" ");

    // 9 A1 + 2 inflected C2 → scored=11
    // Without lemma: 9/11=81.8% < 90% → C2
    // With running→run(A2) + writings→write(A2): A2 cumulative = 100% → A2
    const INFLECTED_ARTICLE = [
      "the and was she they you have had are",
      "running writings",
      "this sentence just padding that text exceeds hundred characters minimum content",
    ].join(" ");

    // Indonesian: 9 A1 + dibangunkan(C2) + sebisanya(C2) + 11 non-mock pad = 23 unique tokens
    // Without lemma: 9/11 = 81.8% through C1 → C2
    // With lemma (dibangunkan→bangun A1, sebisanya→bisa A1): 11/11 = 100% through A1 → A1
    // Indonesian: 9 A1 + dibangunkan(C2) + sebisanya(C2) + 10 non-mock pad = 21 unique tokens
    // Without lemma: 9/11 = 81.8% through C1 → C2
    // With lemma (dibangunkan→bangun A1, sebisanya→bisa A1): 11/11 = 100% through A1 → A1
    const ID_INFLECTED_ARTICLE = [
      "yang dan ini itu ada bisa tidak dengan untuk",
      "dibangunkan sebisanya",
      "kalimat artikel dibuat sebagai konten pengujian cukup panjang bahwa termasuk",
    ].join(" ");

    function makeIsolatedDoc(articleText) {
      const doc = document.implementation.createHTMLDocument("test");
      doc.body.innerHTML = `<p>${articleText}</p>`;
      return doc;
    }

    function waitForPanel(doc, timeoutMs) {
      return new Promise((resolve, reject) => {
        const t0 = Date.now();
        (function poll() {
          const panel = doc.getElementById("laDifficultyPanel");
          if (panel) return resolve(panel);
          if (Date.now() - t0 > timeoutMs) return reject(new Error("panel did not appear"));
          setTimeout(poll, 50);
        }());
      });
    }

    runTests([

      // ═══ 1. WordfreqUtils — basic API ══════════════════════════════════════

      {
        name: "WordfreqUtils.isSupported: known languages are supported",
        run() {
          assert(WFU.isSupported("en"), "en supported");
          assert(WFU.isSupported("zh"), "zh supported");
          assert(WFU.isSupported("ja"), "ja supported");
          assert(WFU.isSupported("ko"), "ko supported");
          assert(WFU.isSupported("de"), "de supported");
          assert(WFU.isSupported("fr"), "fr supported");
          assert(WFU.isSupported("ar"), "ar supported");
          assert(WFU.isSupported("th"), "th supported");
          assert(WFU.isSupported("ur"), "ur supported");
          assert(WFU.isSupported("be"), "be supported");
        },
      },

      {
        name: "WordfreqUtils.isSupported: unsupported langs return false",
        run() {
          assert(!WFU.isSupported("sw"),  "sw not supported");
          assert(!WFU.isSupported("sq"),  "sq not supported");
          assert(!WFU.isSupported("ca"),  "ca not supported");
          assert(!WFU.isSupported(""),    "empty not supported");
          assert(!WFU.isSupported(null),  "null not supported");
          assert(!WFU.isSupported("auto"), "auto not supported");
        },
      },

      {
        name: "WordfreqUtils.normalizeLang: strips region code",
        run() {
          assert(WFU.isSupported("en-US"), "en-US -> en");
          assert(WFU.isSupported("zh-TW"), "zh-TW -> zh");
          assert(WFU.isSupported("de-AT"), "de-AT -> de");
        },
      },

      {
        name: "WordfreqUtils.getDifficultyTier: EN Zipf thresholds [5.3,4.7,4.2,3.7,3.2]",
        run() {
          assertEqual(WFU.getDifficultyTier(7.0,  "en"), "A1");
          assertEqual(WFU.getDifficultyTier(5.3,  "en"), "A1");  // exactly A1 min
          assertEqual(WFU.getDifficultyTier(5.2,  "en"), "A2");  // just below A1
          assertEqual(WFU.getDifficultyTier(4.7,  "en"), "A2");  // exactly A2 min
          assertEqual(WFU.getDifficultyTier(4.6,  "en"), "B1");  // just below A2
          assertEqual(WFU.getDifficultyTier(4.2,  "en"), "B1");  // exactly B1 min
          assertEqual(WFU.getDifficultyTier(4.1,  "en"), "B2");  // just below B1
          assertEqual(WFU.getDifficultyTier(3.7,  "en"), "B2");  // exactly B2 min
          assertEqual(WFU.getDifficultyTier(3.6,  "en"), "C1");  // just below B2
          assertEqual(WFU.getDifficultyTier(3.2,  "en"), "C1");  // exactly C1 min
          assertEqual(WFU.getDifficultyTier(3.1,  "en"), "C2");  // just below C1
          assertEqual(WFU.getDifficultyTier(0.1,  "en"), "C2");
        },
      },

      {
        name: "WordfreqUtils.getDifficultyTier: null/undefined/zero returns null",
        run() {
          assertEqual(WFU.getDifficultyTier(null,      "en"), null);
          assertEqual(WFU.getDifficultyTier(undefined, "en"), null);
          assertEqual(WFU.getDifficultyTier(0,         "en"), null);  // not in dataset
          assertEqual(WFU.getDifficultyTier(-1,        "en"), null);
        },
      },

      {
        name: "WordfreqUtils.isReady: returns false before init",
        run() {
          // Use a fresh language that hasn't been initialized in this test session
          assert(!WFU.isReady("be"), "be should not be ready before initForLang");
        },
      },

      {
        name: "WordfreqUtils.initForLang: returns false for unsupported lang",
        async run() {
          const result = await WFU.initForLang("xx");
          assertEqual(result, false);
        },
      },

      {
        name: "WordfreqUtils.initForLang: returns false when WordfreqLib absent",
        async run() {
          uninstallMockLib();
          const saved = globalThis.WordfreqLib;
          const result = await WFU.initForLang("lv"); // lv not yet initialized
          assertEqual(result, false);
        },
      },

      {
        name: "WordfreqUtils.initForLang: initializes and getZipf works (English)",
        async run() {
          installMockLib();
          const ok = await WFU.initForLang("en");
          assertEqual(ok, true);
          assert(WFU.isReady("en"), "en should be ready");
          const z = WFU.getZipf("the", "en");
          assert(z !== null && z > 6, "the: high zipf");
          const z2 = WFU.getZipf("zymurgy", "en");
          assertEqual(WFU.getDifficultyTier(z2, "en"), "C2");
        },
      },

      {
        name: "WordfreqUtils.initForLang: second call returns cached promise",
        async run() {
          installMockLib();
          const p1 = WFU.initForLang("en");
          const p2 = WFU.initForLang("en");
          const [r1, r2] = await Promise.all([p1, p2]);
          assertEqual(r1, true);
          assertEqual(r2, true);
        },
      },

      {
        name: "WordfreqUtils.getZipf: returns null if lang not ready",
        run() {
          const z = WFU.getZipf("book", "mk"); // mk not initialized yet
          assertEqual(z, null);
        },
      },

      {
        name: "WordfreqUtils.getZipf: case-insensitive lookup",
        async run() {
          installMockLib();
          await WFU.initForLang("en");
          const z1 = WFU.getZipf("THE", "en");
          const z2 = WFU.getZipf("the", "en");
          assertEqual(z1, z2);
        },
      },

      {
        name: "WordfreqUtils.initForLang: Chinese and tier classification",
        async run() {
          installMockLib();
          await WFU.initForLang("zh");
          assert(WFU.isReady("zh"), "zh ready");
          // ZH thresholds [5.4,4.8,4.3,3.9,3.4]: 的(7.5)→A1, 词(3.5)≥3.4→C1, 琮(0.9)→C2
          assertEqual(WFU.getDifficultyTier(WFU.getZipf("的", "zh"), "zh"), "A1");
          assertEqual(WFU.getDifficultyTier(WFU.getZipf("词", "zh"), "zh"), "C1");
          assertEqual(WFU.getDifficultyTier(WFU.getZipf("琮", "zh"), "zh"), "C2");
        },
      },

      // ═══ 2. ContentDifficulty — tokenizeArticle ════════════════════════════

      {
        name: "tokenizeArticle: basic English, filters short tokens",
        run() {
          const tokens = CD.tokenizeArticle("It is a test of the reading system here", 500, "en");
          assert(tokens.includes("test"), "test included");
          assert(tokens.includes("reading"), "reading included");
          assert(tokens.includes("system"), "system included");
          // Short words filtered (length < 3)
          assert(!tokens.includes("it"), "it filtered");
          assert(!tokens.includes("is"), "is filtered");
          assert(!tokens.includes("of"), "of filtered");
        },
      },

      {
        name: "tokenizeArticle: respects maxTokens limit",
        run() {
          const longText = Array.from({length: 1000}, (_, i) => "word" + i).join(" ");
          const tokens = CD.tokenizeArticle(longText, 50, "en");
          assert(tokens.length <= 50, "max 50 tokens");
        },
      },

      {
        name: "tokenizeArticle: returns unique tokens (deduplicated)",
        run() {
          const tokens = CD.tokenizeArticle("the cat sat the cat sat", 500, "en");
          const set = new Set(tokens);
          assertEqual(set.size, tokens.length);
        },
      },

      {
        name: "tokenizeArticle: CJK lang (zh) — single characters included (minLen=1)",
        run() {
          const tokens = CD.tokenizeArticle("的是在学习中文词频", 500, "zh");
          // Single CJK chars (minLen=1 for zh) must be included
          assert(tokens.length > 0, "CJK tokens extracted");
          assert(tokens.includes("的") || tokens.includes("学"), "single CJK char included");
        },
      },

      {
        name: "tokenizeArticle: Japanese lang (ja) — single hiragana included",
        run() {
          const tokens = CD.tokenizeArticle("日本語の学校", 500, "ja");
          assert(tokens.length > 0, "ja tokens extracted");
        },
      },

      {
        name: "tokenizeArticle: Korean lang (ko) — tokens extracted",
        run() {
          const tokens = CD.tokenizeArticle("이것이 한국어", 500, "ko");
          assert(tokens.length > 0, "ko tokens extracted");
          // Intl.Segmenter may produce word-level segments (이것이, 한국어) rather than single chars
          assert(tokens.some((t) => "이것이한국어".includes(t)), "ko token content present");
        },
      },

      {
        name: "tokenizeArticle: Thai lang (th) — short tokens included",
        run() {
          const tokens = CD.tokenizeArticle("ใน และ ของ ประเทศไทย", 500, "th");
          assert(tokens.length > 0, "th tokens extracted");
        },
      },

      {
        name: "tokenizeArticle: non-CJK lang still filters length < 3",
        run() {
          const tokens = CD.tokenizeArticle("je tu il", 500, "fr");
          // All tokens are length 2 — should be filtered
          assert(!tokens.includes("je"), "fr short token filtered");
          assert(!tokens.includes("tu"), "fr short token filtered");
        },
      },

      // ═══ 3. ContentDifficulty — extractArticleText ════════════════════════

      {
        name: "extractArticleText: collects text from p/article/section elements",
        run() {
          const div = document.createElement("div");
          div.innerHTML = `
            <article>Long article content here about important topics</article>
            <p>Another paragraph with plenty of readable text here</p>
            <section>A section with additional context and information</section>
          `;
          document.body.appendChild(div);
          const text = CD.extractArticleText(div.ownerDocument || document);
          document.body.removeChild(div);
          assert(text.includes("article content"), "article text found");
          assert(text.includes("paragraph"), "paragraph text found");
        },
      },

      {
        name: "extractArticleText: skips la- extension elements",
        run() {
          const div = document.createElement("div");
          div.innerHTML = `
            <p>Real article content that should be included in analysis</p>
            <div class="la-popup"><p>Extension UI text — ignore this</p></div>
            <div id="laDifficultyPanel"><p>Panel text — ignore this</p></div>
          `;
          document.body.appendChild(div);
          const text = CD.extractArticleText(div.ownerDocument || document);
          document.body.removeChild(div);
          assert(text.includes("Real article"), "real content included");
          assert(!text.includes("Extension UI"), "la-class content excluded");
          assert(!text.includes("Panel text"), "panel content excluded");
        },
      },

      {
        name: "extractArticleText: skips short text elements (< 20 chars)",
        run() {
          const div = document.createElement("div");
          div.innerHTML = `
            <p>Hi</p>
            <p>This is a longer paragraph that definitely passes the twenty-character threshold</p>
          `;
          document.body.appendChild(div);
          const text = CD.extractArticleText(div.ownerDocument || document);
          document.body.removeChild(div);
          assert(!text.includes("Hi"), "short text skipped");
          assert(text.includes("longer paragraph"), "long text included");
        },
      },

      // ═══ 4. ContentDifficulty — computeDistribution ═══════════════════════

      {
        name: "computeDistribution: returns null when WordfreqUtils not ready",
        run() {
          const tokens = ["parchment", "lexicon", "book"];
          const result = CD.computeDistribution(tokens, "de"); // de not initialized
          assertEqual(result, null);
        },
      },

      {
        name: "computeDistribution: English easy article → B1 level",
        async run() {
          installMockLib();
          await WFU.initForLang("en");
          // EN thresholds [5.3,4.7,4.2,3.7,3.2]
          // the/and/is/was(≥5.3)=A1(×4); book(4.5)/city(4.3)/water(4.6)/read(4.4) ≥4.2 → B1(×4)
          // cumulative: A1=50%, A1+A2=50%, A1+A2+B1=100% ≥ 90% → B1
          const tokens = ["the", "and", "is", "was", "book", "city", "water", "read"];
          const result = CD.computeDistribution(tokens, "en");
          assert(result !== null, "result not null");
          assertEqual(result.a1, 4, "a1=4");
          assertEqual(result.a2, 0, "a2=0 (4.3–4.6 is B1 for EN, not A2)");
          assertEqual(result.b1, 4, "b1=4");
          assertEqual(result.level, "B1");
        },
      },

      {
        name: "computeDistribution: English hard text → C2 level",
        async run() {
          installMockLib();
          await WFU.initForLang("en");
          // all 9 words have Zipf < 3.5 → all C2
          // cumulative: through C1 = 0/9 = 0% → C2
          const tokens = ["parchment", "lexicon", "breviary", "codex", "palimpsest", "zymurgy", "pogonology", "tmesis", "anfractuous"];
          const result = CD.computeDistribution(tokens, "en");
          assert(result !== null, "result not null");
          assertEqual(result.c1, 0, "c1=0 (all below C1 threshold)");
          assertEqual(result.c2, 9, "c2=9 (all C2)");
          assertEqual(result.level, "C2");
        },
      },

      {
        name: "computeDistribution: returns null for empty tokens",
        async run() {
          installMockLib();
          await WFU.initForLang("en");
          const result = CD.computeDistribution([], "en");
          assertEqual(result, null);
        },
      },

      {
        name: "computeDistribution: bucket counts sum to scored",
        async run() {
          installMockLib();
          await WFU.initForLang("en");
          const tokens = ["the", "book", "parchment", "zymurgy", "and", "lexicon"];
          const result = CD.computeDistribution(tokens, "en");
          assert(result !== null, "result not null");
          assertEqual(result.a1 + result.a2 + result.b1 + result.b2 + result.c1 + result.c2, result.scored);
        },
      },

      {
        name: "computeDistribution: mixed text → B2 level",
        async run() {
          installMockLib();
          await WFU.initForLang("en");
          // the/and/is=A1(×3), book/water=A2(×2), city/read=B1(×2), ponder(3.8)=B2(×1)
          // cumulative: through B1=7/8=87.5% < 93%; through B2=8/8=100% ≥ 93% → B2
          const tokens = ["the", "and", "is", "book", "water", "city", "read", "ponder"];
          const result = CD.computeDistribution(tokens, "en");
          assert(result !== null, "result not null");
          assertEqual(result.b2, 1, "b2=1 (ponder at 3.8)");
          assertEqual(result.level, "B2");
        },
      },

      {
        name: "computeDistribution: harder words push level up",
        async run() {
          installMockLib();
          await WFU.initForLang("en");
          // Easy baseline: the/and/is=A1(×3), book=A2(×1), city=B1(×1)
          // cumulative: through B1 = 5/5 = 100% ≥ 93% → B1
          const easyTokens = ["the", "and", "is", "book", "city"];
          const easyResult = CD.computeDistribution(easyTokens, "en");
          assertEqual(easyResult.level, "B1", "easy baseline is B1");
          // With C1 words: the/and/is=A1(×3), book=A2(×1), sorrow/wander=C1(×2)
          // cumulative: through B1=4/6=67%; through B2=4/6=67%; through C1=6/6=100% ≥ 93% → C1
          const harderTokens = ["the", "and", "is", "book", "sorrow", "wander"];
          const harderResult = CD.computeDistribution(harderTokens, "en");
          assertEqual(harderResult.level, "C1", "adding C1 words raises level to C1");
        },
      },

      {
        name: "computeDistribution: Chinese tokens scored correctly",
        async run() {
          installMockLib();
          await WFU.initForLang("zh");
          const tokens = ["的", "是", "学", "词", "频", "璎"];
          const result = CD.computeDistribution(tokens, "zh");
          assert(result !== null, "zh result not null");
          assert(result.scored > 0, "zh scored > 0");
        },
      },

      // ═══ 5. computeContextScore — Latin (non-CJK) ═════════════════════════

      {
        name: "computeContextScore: English — returns higher score for common-word context",
        async run() {
          installMockLib();
          await WFU.initForLang("en");
          // Sentence with only very-common words around the target
          const easyCtx = "The book was in the house and she read it";
          // Sentence with mostly rare words around the target
          const hardCtx = "The parchment contained a palimpsest lexicon and codex breviary";
          const scoreEasy = CPP.computeContextScore(easyCtx, "book", WFU, "en");

        // This correctly returns the lemma string when found.
        async run() {
          installMockLib();
          await WFU.initForLang("id");
          const doc = makeIsolatedDoc(ID_INFLECTED_ARTICLE);
          // Simulate fixed getLemma: returns the lemma directly (as resolveLemma now provides)
          CD.analyzeAndShow({
            sourceLang: "id",
            document: doc,
            getLemma: (word) => {
              // dibangunkan → bangun (A1, zipf=5.6); sebisanya → bisa (A1, zipf=5.5)
              const lemmaMap = { dibangunkan: "bangun", sebisanya: "bisa" };
              return Promise.resolve(lemmaMap[word] || null);
            },
          });
          const panel = await waitForPanel(doc, 3000);
          const level = panel.querySelector(".la-difficulty-panel-level")?.textContent?.trim();
          assertEqual(level, "A1", "level upgrades to A1 when lemmas are correctly resolved");
        },
      },

      {
        name: "id regression: getLemma not called for non-C2 tokens (yang/dan/bisa are A1)",
        async run() {
          installMockLib();
          await WFU.initForLang("id");
          const doc = makeIsolatedDoc(ID_INFLECTED_ARTICLE);
          const wordsQueried = [];
          CD.analyzeAndShow({
            sourceLang: "id",
            document: doc,
            getLemma: (word) => { wordsQueried.push(word); return Promise.resolve(null); },
          });
          await waitForPanel(doc, 3000);
          // Only C1/C2 tokens should be queried
          assert(!wordsQueried.includes("yang"),   "A1 word 'yang' not queried");
          assert(!wordsQueried.includes("bisa"),   "A1 word 'bisa' not queried");
          assert(wordsQueried.includes("dibangunkan"), "C2 word 'dibangunkan' queried");
          assert(wordsQueried.includes("sebisanya"),   "C2 word 'sebisanya' queried");
        },
      },

    ]);
  </script>
