<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>content-page-processing</title>
</head>
<body>
  <pre id="test-output"></pre>
  <script src="../lib/sentence-splitter.js"></script>
  <script src="../lib/example-utils.js"></script>
  <script src="../lib/content-page-processing.js"></script>
  <script src="./lib/test-harness.js"></script>
  <script>
    const { assert, assertEqual, runTests } = window.TestHarness;
    const U = window.ContentPageProcessing;

    runTests([
      {
        name: "findNextWholeWordIndex respects boundaries for latin words",
        run() {
          const text = "running runner run";
          const lower = text.toLowerCase();
          assertEqual(U.findNextWholeWordIndex(text, lower, "run", 0), 15);
          assertEqual(U.containsWord(text, "runner"), true);
          assertEqual(U.containsWord(text, "runn"), false);
        },
      },
      {
        name: "compact-script matching respects segment boundaries instead of raw substrings",
        run() {
          const text = "今日は学校へ行きます。今日は小学校にも寄ります。";
          const lower = text.toLowerCase();
          assertEqual(U.findNextWholeWordIndex(text, lower, "学校", 0, "ja"), 3);
          assertEqual(U.containsWord("今日は学校へ行きます。", "学校", "ja"), true);
          assertEqual(U.containsWord("今日は小学校へ行きます。", "学校", "ja"), false);
        },
      },
      {
        name: "findTextNodes skips script tags and extension ui",
        run() {
          const host = document.createElement("div");
          host.innerHTML = `
            <p>alpha beta</p>
            <script>ignored<\/script>
            <div id="translationBox">ignored ui</div>
            <div class="la-tour-card">ignored tour</div>
          `;
          document.body.appendChild(host);
          const nodes = U.findTextNodes(host, {
            Node,
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement(element) {
              return !!(
                element &&
                ((element.id && element.id === "translationBox") ||
                (element.classList && Array.from(element.classList).some((name) => name.startsWith("la-"))))
              );
            },
          });
          assertEqual(nodes.length, 1);
          assertEqual(nodes[0].nodeValue.trim(), "alpha beta");
          host.remove();
        },
      },
      {
        name: "buildHighlightedFragment wraps matched words and leaves learned words alone",
        run() {
          const fragment = U.buildHighlightedFragment("run and rest", [
            { form: "run", rootWord: "run", isFamily: false },
            { form: "rest", rootWord: "rest", isFamily: false },
          ], {
            run: { meaning: "move fast", learned: false, examples: [] },
            rest: { meaning: "pause", learned: true, examples: [] },
          }, {
            document,
            showWordPreview() {},
            hideWordPreview() {},
          });
          assert(fragment, "expected fragment");
          const wrapper = document.createElement("div");
          wrapper.appendChild(fragment);
          assertEqual(wrapper.querySelectorAll(".plugin-highlight-word").length, 1);
          assertEqual(wrapper.querySelector(".plugin-highlight-word").textContent, "run");
          assertEqual(wrapper.textContent, "run and rest");
        },
      },
      {
        name: "buildHighlightTargets includes family forms and marks them secondary",
        run() {
          const targets = U.buildHighlightTargets(["run"], {
            run: {
              learned: false,
              familyForms: ["running", "ran", "run"],
            },
          });
          assertEqual(targets[0].form, "running");
          assert(targets.some((item) => item.form === "run" && item.isFamily === false), "expected root target");
          assert(targets.some((item) => item.form === "running" && item.isFamily === true), "expected family target");
        },
      },
      {
        name: "buildHighlightTargets prefers explicit stored roots over another word's family form",
        run() {
          const targets = U.buildHighlightTargets(["running", "run"], {
            running: {
              learned: false,
              familyForms: ["run", "runs"],
            },
            run: {
              learned: false,
              familyForms: ["running"],
            },
          });
          const runTargets = targets.filter((item) => item.form === "run");
          assertEqual(runTargets.length, 1);
          assertEqual(runTargets[0].rootWord, "run");
          assertEqual(runTargets[0].isFamily, false);
          assert(targets.some((item) => item.form === "runs" && item.rootWord === "running" && item.isFamily === true), "expected non-conflicting family form kept");
        },
      },
      {
        name: "buildHighlightedFragment renders family matches with family highlight class",
        run() {
          const fragment = U.buildHighlightedFragment("running fast", [
            { form: "running", rootWord: "run", isFamily: true },
            { form: "run", rootWord: "run", isFamily: false },
          ], {
            run: { meaning: "move fast", learned: false, examples: [] },
          }, {
            document,
            showWordPreview() {},
            hideWordPreview() {},
          });
          assert(fragment, "expected fragment");
          const wrapper = document.createElement("div");
          wrapper.appendChild(fragment);
          const familyEl = wrapper.querySelector(".plugin-highlight-family-word");
          assert(familyEl, "expected family highlight");
          assertEqual(familyEl.textContent, "running");
        },
      },
      {
        name: "buildHighlightedFragment avoids compact-script substring false positives",
        run() {
          const fragment = U.buildHighlightedFragment("今日は小学校へ行きます。", [
            { form: "学校", rootWord: "学校", isFamily: false },
          ], {
            学校: { meaning: "school", learned: false, examples: [] },
          }, {
            document,
            languageHint: "ja",
            showWordPreview() {},
            hideWordPreview() {},
          });
          assertEqual(fragment, null);
        },
      },
      {
        name: "family highlight hover sends current form plus saved root metadata",
        run() {
          let previewPayload = null;
          const host = document.createElement("p");
          const sourceNode = document.createTextNode("running fast");
          host.appendChild(sourceNode);
          document.body.appendChild(host);
          const fragment = U.buildHighlightedFragment("running fast", [
            { form: "running", rootWord: "run", isFamily: true },
          ], {
            run: { meaning: "move fast", learned: false, examples: [{ text: "run daily" }] },
          }, {
            document,
            languageHint: "en",
            splitIntoSentences: window.ExampleUtils.splitIntoSentences,
            showWordPreview(anchor, payload) {
              previewPayload = { anchorText: anchor.textContent, payload };
            },
            hideWordPreview() {},
          }, sourceNode);
          const wrapper = document.createElement("div");
          wrapper.appendChild(fragment);
          const familyEl = wrapper.querySelector(".plugin-highlight-family-word");
          assert(familyEl, "expected family highlight");
          familyEl.dispatchEvent(new MouseEvent("mouseenter", { bubbles: true }));
          assert(previewPayload, "expected preview payload");
          assertEqual(previewPayload.anchorText, "running");
          assertEqual(previewPayload.payload.mode, "family");
          assertEqual(previewPayload.payload.currentForm, "running");
          assertEqual(previewPayload.payload.rootWord, "run");
          assertEqual(previewPayload.payload.rootMeaning, "move fast");
          assertEqual(previewPayload.payload.contextSentence, "running fast");
          assertEqual(previewPayload.payload.contextWordPos, 0);
          host.remove();
        },
      },
      {
        name: "clicking root highlight marks learned, clicking family highlight opens add-word flow",
        run() {
          const calls = [];
          const host = document.createElement("p");
          const sourceNode = document.createTextNode("run while running");
          host.appendChild(sourceNode);
          document.body.appendChild(host);
          const fragment = U.buildHighlightedFragment("run while running", [
            { form: "running", rootWord: "run", isFamily: true },
            { form: "run", rootWord: "run", isFamily: false },
          ], {
            run: { meaning: "move fast", learned: false, examples: [] },
          }, {
            document,
            languageHint: "en",
            splitIntoSentences: window.ExampleUtils.splitIntoSentences,
            showWordPreview() {},
            hideWordPreview() {},
          }, sourceNode);
          const wrapper = document.createElement("div");
          wrapper.appendChild(fragment);
          document.body.appendChild(wrapper);
          U.addClickEventToHighlightedWords(document, {
            onRootClick(text) {
              calls.push(`root:${text}`);
            },
            onFamilyClick(payload) {
              calls.push(`family:${payload.word}:${payload.contextWordPos}`);
            },
          });
          const highlights = wrapper.querySelectorAll(".plugin-highlight-word");
          highlights[0].dispatchEvent(new MouseEvent("click", { bubbles: true }));
          highlights[1].dispatchEvent(new MouseEvent("click", { bubbles: true }));
          assertEqual(calls.length, 2);
          assertEqual(calls[0], "root:run");
          assertEqual(calls[1], "family:running:10");
          wrapper.remove();
          host.remove();
        },
      },
      {
        name: "resolveMatchSentenceContext returns sentence and exact word position",
        run() {
          const container = document.createElement("p");
          const textNode = document.createTextNode("We sat on the river bank. Later, we rested.");
          container.appendChild(textNode);
          document.body.appendChild(container);
          const context = U.resolveMatchSentenceContext(textNode, 20, "bank", {
            document,
            languageHint: "en",
            splitIntoSentences: window.ExampleUtils.splitIntoSentences,
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement() { return false; },
          });
          assertEqual(context.found, true);
          assertEqual(context.sentence, "We sat on the river bank.");
          assertEqual(context.wordPos, 20);
          container.remove();
        },
      },
      {
        name: "buildContextPayloadFromContainer fails safely when repeated word cannot be disambiguated",
        run() {
          const context = U.buildContextPayloadFromContainer(
            "bank by the bank",
            "bank",
            1,
            "en",
            (text) => [text]
          );
          assertEqual(context.found, false);
          assertEqual(context.wordPos, null);
        },
      },
      {
        name: "collectExampleCandidates only collects unlearned exact matches",
        run() {
          const textNode = document.createTextNode("He was running quickly. The runner smiled.");
          const container = document.createElement("p");
          container.appendChild(textNode);
          document.body.appendChild(container);
          const result = U.collectExampleCandidates([textNode], ["running", "runner"], {
            running: { learned: false },
            runner: { learned: true },
          }, {
            splitIntoSentences(text) {
              return text.split(".").map((part) => part.trim()).filter(Boolean);
            },
            isLowInformationExample() { return false; },
            normalizeText(text) {
              return (text || "").replace(/\s+/g, " ").trim();
            },
            currentHref: "https://example.com/page",
          });
          assertEqual(Array.isArray(result.running), true);
          assertEqual(result.running.length, 1);
          assertEqual(result.running[0].text, "He was running quickly");
          assertEqual(result.runner, undefined);
          container.remove();
        },
      },
      {
        name: "collectExampleCandidates captures highlighted paragraph context for Kendati",
        run() {
          const host = document.createElement("div");
          host.innerHTML = `
            <p><span class="plugin-highlight-word">Kendati</span> mengusung fungsi serupa, Xiaomi Tag tampil dengan pendekatan desain yang sedikit berbeda. Perangkat ini berbentuk elips tipis dengan ukuran ringkas dan bobot sekitar 10 gram.</p>
          `;
          document.body.appendChild(host);
          const nodes = U.findTextNodes(host, {
            Node,
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement(element) {
              return !!(element && element.classList && element.classList.contains("plugin-highlight-word"));
            },
          });
          const result = U.collectExampleCandidates(nodes, ["kendati"], {
            kendati: { learned: false },
          }, {
            splitIntoSentences: window.ExampleUtils.splitIntoSentences,
            isLowInformationExample: window.ExampleUtils.isLowInformationExample,
            normalizeText: window.ExampleUtils.normalizeText,
            currentHref: "https://example.com/page",
          });
          assertEqual(Array.isArray(result.kendati), true);
          assertEqual(result.kendati.length >= 1, true);
          assertEqual(result.kendati[0].text.includes("Kendati mengusung fungsi serupa"), true);
          host.remove();
        },
      },
      {
        name: "collectExampleCandidates keeps long Indonesian news sentence under relaxed limit",
        run() {
          const textNode = document.createTextNode("Pangkalpinang, InfoPublik - Kendati tidak ditemukan anak dengan kondisi stunting di Kelurahan Bacang Pangkalpinang, Penjabat (Pj) Gubernur Kepulauan Bangka Belitung (Kep. Babel) Suganda Pandapotan Pasaribu, meminta agar ibu hamil, dan orang tua dengan anak balita, untuk senantiasa memperhatikan asupan gizi.");
          const container = document.createElement("p");
          container.appendChild(textNode);
          document.body.appendChild(container);
          const result = U.collectExampleCandidates([textNode], ["kendati"], {
            kendati: { learned: false },
          }, {
            splitIntoSentences: window.ExampleUtils.splitIntoSentences,
            isLowInformationExample: window.ExampleUtils.isLowInformationExample,
            normalizeText: window.ExampleUtils.normalizeText,
            currentHref: "https://example.com/page",
          });
          assertEqual(Array.isArray(result.kendati), true);
          assertEqual(result.kendati.length, 1);
          assertEqual(result.kendati[0].text.includes("Kendati tidak ditemukan"), true);
          container.remove();
        },
      },
      {
        name: "enqueueExampleCandidates counts the current page only once for new words",
        async run() {
          const savedPayloads = [];
          const wordsData = {
            berjalan: {
              learned: false,
              meaning: "walk",
              examples: [],
              encounterCount: 0,
              pageCount: 0,
              encounterPageKeys: [],
            },
          };
          const state = { pendingExampleMap: {}, exampleMergeTimer: null };
          U.enqueueExampleCandidates({
            berjalan: [
              { text: "Ia berjalan ke pasar.", sourceUrl: "https://example.com/a", capturedAt: 100 },
              { text: "Mereka berjalan pulang.", sourceUrl: "https://example.com/a", capturedAt: 101 },
            ],
          }, state, {
            WordStorage: {
              getWords() { return Promise.resolve(JSON.parse(JSON.stringify(wordsData))); },
              saveWords(next) {
                savedPayloads.push(next);
                return Promise.resolve();
              },
            },
            normalizeExampleList: window.ExampleUtils.normalizeExampleList,
            normalizeText(text) { return (text || "").replace(/\s+/g, " ").trim(); },
            isLowInformationExample: window.ExampleUtils.isLowInformationExample,
            hasContainmentRelation: window.ExampleUtils.hasContainmentRelation,
            isTooSimilarToAny: window.ExampleUtils.isTooSimilarToAny,
            sortExamples: window.ExampleUtils.sortExamples,
            enforceExampleLimit: window.ExampleUtils.enforceExampleLimit,
            maxExamplesPerWord: 20,
            currentHref: "https://example.com/a?ref=1",
            onError(error) { throw error; },
          });
          await new Promise((resolve) => setTimeout(resolve, 1300));
          assertEqual(savedPayloads.length, 1);
          const saved = savedPayloads[0].berjalan;
          assertEqual(saved.pageCount, 1);
          assertEqual(saved.encounterPageKeys.length, 1);
          assertEqual(saved.encounterCount, 2);
        },
      },
      {
        name: "enqueueExampleCandidates stores contextScore on new examples when wordfreq ready",
        async run() {
          const savedPayloads = [];
          const wordsData = {
            berjalan: { learned: false, meaning: "walk", examples: [], encounterCount: 0, pageCount: 0, encounterPageKeys: [] },
          };
          const state = { pendingExampleMap: {}, exampleMergeTimer: null };
          const mockWordfreq = {
            isReady() { return true; },
            getZipf(word) {
              return { yang: 7.0, ke: 6.5, pasar: 4.2, mereka: 5.8, pulang: 4.0 }[word] ?? null;
            },
          };
          U.enqueueExampleCandidates({
            berjalan: [
              { text: "Ia berjalan ke pasar.", sourceUrl: "https://example.com/a", capturedAt: 100 },
            ],
          }, state, {
            WordStorage: {
              getWords() { return Promise.resolve(JSON.parse(JSON.stringify(wordsData))); },
              saveWords(next) { savedPayloads.push(next); return Promise.resolve(); },
            },
            WordfreqUtils: mockWordfreq,
            sourceLang: "id",
            normalizeExampleList: window.ExampleUtils.normalizeExampleList,
            normalizeText(text) { return (text || "").replace(/\s+/g, " ").trim(); },
            isLowInformationExample: window.ExampleUtils.isLowInformationExample,
            hasContainmentRelation: window.ExampleUtils.hasContainmentRelation,
            isTooSimilarToAny: window.ExampleUtils.isTooSimilarToAny,
            sortExamples: window.ExampleUtils.sortExamples,
            enforceExampleLimit: window.ExampleUtils.enforceExampleLimit,
            maxExamplesPerWord: 20,
            currentHref: "https://example.com/a",
            onError(error) { throw error; },
          });
          await new Promise((resolve) => setTimeout(resolve, 1300));
          assertEqual(savedPayloads.length, 1);
          const ex = savedPayloads[0].berjalan.examples[0];
          assertEqual(ex.text, "Ia berjalan ke pasar.");
          assertEqual(typeof ex.contextScore, "number", "contextScore should be a number");
          assert(ex.contextScore > 0, "contextScore should be positive");
        },
      },
      {
        name: "enqueueExampleCandidates: higher contextScore example sorts first",
        async run() {
          const savedPayloads = [];
          const wordsData = {
            berjalan: { learned: false, meaning: "walk", examples: [], encounterCount: 0, pageCount: 0, encounterPageKeys: [] },
          };
          const state = { pendingExampleMap: {}, exampleMergeTimer: null };
          // "Ia berjalan ke pasar": context words ke(6.5), pasar(4.2), ia(~5) → average ~5.2
          // "Mengimplementasikan berjalan secara efisien": context words are rare → low score
          const scores = { ke: 6.5, pasar: 4.2, ia: 5.0, secara: 4.0, mengimplementasikan: 1.5, efisien: 2.0 };
          const mockWordfreq = {
            isReady() { return true; },
            getZipf(word) { return scores[word] ?? null; },
          };
          U.enqueueExampleCandidates({
            berjalan: [
              { text: "Mengimplementasikan berjalan secara efisien.", capturedAt: 200 },
              { text: "Ia berjalan ke pasar.", capturedAt: 100 },
            ],
          }, state, {
            WordStorage: {
              getWords() { return Promise.resolve(JSON.parse(JSON.stringify(wordsData))); },
              saveWords(next) { savedPayloads.push(next); return Promise.resolve(); },
            },
            WordfreqUtils: mockWordfreq,
            sourceLang: "id",
            normalizeExampleList: window.ExampleUtils.normalizeExampleList,
            normalizeText(text) { return (text || "").replace(/\s+/g, " ").trim(); },
            isLowInformationExample: window.ExampleUtils.isLowInformationExample,
            hasContainmentRelation: window.ExampleUtils.hasContainmentRelation,
            isTooSimilarToAny: window.ExampleUtils.isTooSimilarToAny,
            sortExamples: window.ExampleUtils.sortExamples,
            enforceExampleLimit: window.ExampleUtils.enforceExampleLimit,
            maxExamplesPerWord: 20,
            currentHref: "https://example.com/b",
            onError(error) { throw error; },
          });
          await new Promise((resolve) => setTimeout(resolve, 1300));
          assertEqual(savedPayloads.length, 1);
          const examples = savedPayloads[0].berjalan.examples;
          assertEqual(examples[0].text, "Ia berjalan ke pasar.", "simpler context sentence should rank first");
        },
      },
      {
        name: "enqueueExampleCandidates retroactively scores existing examples without contextScore",
        async run() {
          const savedPayloads = [];
          const wordsData = {
            berjalan: {
              learned: false, meaning: "walk",
              examples: [{ text: "Ia berjalan ke pasar.", pinned: false, createdAt: 50, capturedAt: 50 }],
              encounterCount: 1, pageCount: 0, encounterPageKeys: [],
            },
          };
          const state = { pendingExampleMap: {}, exampleMergeTimer: null };
          const mockWordfreq = {
            isReady() { return true; },
            getZipf(word) { return { ke: 6.5, pasar: 4.2, ia: 5.0 }[word] ?? null; },
          };
          // Send the same sentence again — it's in existingSet, so retroactive scoring kicks in
          U.enqueueExampleCandidates({
            berjalan: [
              { text: "Ia berjalan ke pasar.", capturedAt: 50 },
            ],
          }, state, {
            WordStorage: {
              getWords() { return Promise.resolve(JSON.parse(JSON.stringify(wordsData))); },
              saveWords(next) { savedPayloads.push(next); return Promise.resolve(); },
            },
            WordfreqUtils: mockWordfreq,
            sourceLang: "id",
            normalizeExampleList: window.ExampleUtils.normalizeExampleList,
            normalizeText(text) { return (text || "").replace(/\s+/g, " ").trim(); },
            isLowInformationExample: window.ExampleUtils.isLowInformationExample,
            hasContainmentRelation: window.ExampleUtils.hasContainmentRelation,
            isTooSimilarToAny: window.ExampleUtils.isTooSimilarToAny,
            sortExamples: window.ExampleUtils.sortExamples,
            enforceExampleLimit: window.ExampleUtils.enforceExampleLimit,
            maxExamplesPerWord: 20,
            currentHref: "https://example.com/c",
            onError(error) { throw error; },
          });
          await new Promise((resolve) => setTimeout(resolve, 1300));
          assertEqual(savedPayloads.length, 1, "should save since contextScore was added");
          const ex = savedPayloads[0].berjalan.examples[0];
          assertEqual(typeof ex.contextScore, "number", "retroactive contextScore should be set");
          assert(ex.contextScore > 0);
        },
      },
      {
        name: "highlightWords triggers content tour after visible highlights appear",
        async run() {
          const host = document.createElement("div");
          host.textContent = "running words stay visible";
          document.body.appendChild(host);
          let tourCalls = 0;
          const originalRequestAnimationFrame = window.requestAnimationFrame;
          const originalGetClientRects = Element.prototype.getClientRects;
          window.requestAnimationFrame = function (callback) {
            return window.setTimeout(() => callback(Date.now()), 0);
          };
          Element.prototype.getClientRects = function () {
            if (this.classList && this.classList.contains("plugin-highlight-word")) {
              return [{ left: 0, top: 0, right: 40, bottom: 18, width: 40, height: 18 }];
            }
            return originalGetClientRects.call(this);
          };
          const state = {
            pendingExampleMap: {},
            exampleMergeTimer: null,
            contentTourAttempted: false,
            contentTourPending: false,
          };
          U.highlightWords({
            document,
            Node,
            WordStorage: {
              getWords() {
                return Promise.resolve({
                  running: { meaning: "run", learned: false, examples: [] },
                });
              },
              saveWords() {
                return Promise.resolve();
              },
            },
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement(element) {
              return !!(element && element.classList && element.classList.contains("la-tour-card"));
            },
            showWordPreview() {},
            hideWordPreview() {},
            splitIntoSentences(text) {
              return [text];
            },
            isLowInformationExample() { return false; },
            normalizeText(text) {
              return (text || "").replace(/\s+/g, " ").trim();
            },
            normalizeExampleList(entries) {
              return entries || [];
            },
            hasContainmentRelation() { return false; },
            isTooSimilarToAny() { return false; },
            enforceExampleLimit(entries) { return entries; },
            sortExamples(entries) { return entries; },
            maxExamplesPerWord: 20,
            currentHref() { return "https://example.com/page"; },
            onMergeError(error) { throw error; },
            onHighlightError(error) { throw error; },
            markLearned() {},
            openAddWordModal() {},
            startContentTour() {
              tourCalls += 1;
              return true;
            },
            isCurrentDomainExcluded() {
              return Promise.resolve(false);
            },
            state,
          });
          try {
            await new Promise((resolve) => setTimeout(resolve, 80));
            assert(document.querySelector(".plugin-highlight-word"), "expected highlighted word");
            assertEqual(tourCalls, 1);
            assertEqual(state.contentTourAttempted, true);
            assertEqual(state.contentTourPending, false);
          } finally {
            window.requestAnimationFrame = originalRequestAnimationFrame;
            Element.prototype.getClientRects = originalGetClientRects;
            host.remove();
          }
        },
      },
      {
        name: "highlightWords wires family clicks to add-word flow and root clicks to learned flow",
        async run() {
          const host = document.createElement("div");
          host.textContent = "run while running";
          document.body.appendChild(host);
          const calls = [];
          const state = {
            pendingExampleMap: {},
            exampleMergeTimer: null,
            contentTourAttempted: true,
            contentTourPending: false,
          };
          U.highlightWords({
            document,
            Node,
            WordStorage: {
              getWords() {
                return Promise.resolve({
                  run: {
                    meaning: "move fast",
                    learned: false,
                    examples: [],
                    familyForms: ["running"],
                  },
                });
              },
              saveWords() {
                return Promise.resolve();
              },
            },
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement() {
              return false;
            },
            showWordPreview() {},
            hideWordPreview() {},
            splitIntoSentences(text) {
              return [text];
            },
            isLowInformationExample() { return false; },
            normalizeText(text) {
              return (text || "").replace(/\s+/g, " ").trim();
            },
            normalizeExampleList(entries) {
              return entries || [];
            },
            hasContainmentRelation() { return false; },
            isTooSimilarToAny() { return false; },
            enforceExampleLimit(entries) { return entries; },
            sortExamples(entries) { return entries; },
            maxExamplesPerWord: 20,
            currentHref() { return "https://example.com/page"; },
            onMergeError(error) { throw error; },
            onHighlightError(error) { throw error; },
            markLearned(text) {
              calls.push(`root:${text}`);
            },
            openAddWordModal(text) {
              calls.push(`family:${text.word}:${text.contextWordPos}`);
            },
            startContentTour() {
              return true;
            },
            isCurrentDomainExcluded() {
              return Promise.resolve(false);
            },
            state,
          });
          try {
            await new Promise((resolve) => setTimeout(resolve, 30));
            const rootEl = host.querySelector('.plugin-highlight-word:not(.plugin-highlight-family-word)');
            const familyEl = host.querySelector('.plugin-highlight-family-word');
            assert(rootEl, "expected root highlight");
            assert(familyEl, "expected family highlight");
            rootEl.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            familyEl.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            assertEqual(calls.length, 2);
            assertEqual(calls[0], "root:run");
            assertEqual(calls[1], "family:running:10");
          } finally {
            host.remove();
          }
        },
      },
      {
        name: "findTextNodes handles deeply nested DOM without stack overflow",
        run() {
          // Build 200-level deep nesting — recursive version would risk overflow
          let inner = document.createElement("div");
          inner.appendChild(document.createTextNode("deep text"));
          for (let i = 0; i < 200; i += 1) {
            const wrapper = document.createElement("div");
            wrapper.appendChild(inner);
            inner = wrapper;
          }
          document.body.appendChild(inner);
          const nodes = U.findTextNodes(inner, {
            Node,
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement() { return false; },
          });
          assertEqual(nodes.length, 1);
          assertEqual(nodes[0].nodeValue, "deep text");
          inner.remove();
        },
      },
      {
        name: "findTextNodes returns all text nodes across siblings and nesting",
        run() {
          const host = document.createElement("div");
          host.innerHTML = `
            <p>first paragraph</p>
            <div><span>nested span</span><em>italic</em></div>
            <script>skipped script<\/script>
            <p>third paragraph</p>
          `;
          document.body.appendChild(host);
          const nodes = U.findTextNodes(host, {
            Node,
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement() { return false; },
          });
          const texts = nodes.map((n) => n.nodeValue.trim()).filter(Boolean);
          assert(texts.includes("first paragraph"), "expected first paragraph");
          assert(texts.includes("nested span"), "expected nested span");
          assert(texts.includes("italic"), "expected italic");
          assert(texts.includes("third paragraph"), "expected third paragraph");
          assert(!texts.includes("skipped script"), "script content must be excluded");
          host.remove();
        },
      },
      {

          document.body.appendChild(insideHost);
          const state = { pendingExampleMap: {}, exampleMergeTimer: null, contentTourAttempted: true, contentTourPending: false };
          U.highlightWords({
            document,
            Node,
            WordStorage: {
              getWords() { return Promise.resolve({ run: { meaning: "move", learned: false, examples: [] } }); },
              saveWords() { return Promise.resolve(); },
            },
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement() { return false; },
            showWordPreview() {},
            hideWordPreview() {},
            splitIntoSentences(text) { return [text]; },
            isLowInformationExample() { return false; },
            normalizeText(text) { return (text || "").replace(/\s+/g, " ").trim(); },
            normalizeExampleList(e) { return e || []; },
            hasContainmentRelation() { return false; },
            isTooSimilarToAny() { return false; },
            enforceExampleLimit(e) { return e; },
            sortExamples(e) { return e; },
            maxExamplesPerWord: 20,
            currentHref() { return "https://example.com/"; },
            onMergeError(e) { throw e; },
            onHighlightError(e) { throw e; },
            markLearned() {},
            openAddWordModal() {},
            startContentTour() { return false; },
            isCurrentDomainExcluded() { return Promise.resolve(false); },
            state,
          }, [insideHost]); // <-- roots: only scan insideHost
          await new Promise((resolve) => setTimeout(resolve, 30));
          assert(!outsideHost.querySelector(".plugin-highlight-word"), "outside host must NOT be highlighted");
          assert(insideHost.querySelector(".plugin-highlight-word"), "inside host must be highlighted");
          outsideHost.remove();
          insideHost.remove();
        },
      },
      {
        name: "highlightWords with null roots highlights entire body",
        async run() {
          const hostA = document.createElement("div");
          hostA.textContent = "run first";
          const hostB = document.createElement("div");
          hostB.textContent = "run second";
          document.body.appendChild(hostA);
          document.body.appendChild(hostB);
          const state = { pendingExampleMap: {}, exampleMergeTimer: null, contentTourAttempted: true, contentTourPending: false };
          U.highlightWords({
            document,
            Node,
            WordStorage: {
              getWords() { return Promise.resolve({ run: { meaning: "move", learned: false, examples: [] } }); },
              saveWords() { return Promise.resolve(); },
            },
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement() { return false; },
            showWordPreview() {},
            hideWordPreview() {},
            splitIntoSentences(text) { return [text]; },
            isLowInformationExample() { return false; },
            normalizeText(text) { return (text || "").replace(/\s+/g, " ").trim(); },
            normalizeExampleList(e) { return e || []; },
            hasContainmentRelation() { return false; },
            isTooSimilarToAny() { return false; },
            enforceExampleLimit(e) { return e; },
            sortExamples(e) { return e; },
            maxExamplesPerWord: 20,
            currentHref() { return "https://example.com/"; },
            onMergeError(e) { throw e; },
            onHighlightError(e) { throw e; },
            markLearned() {},
            openAddWordModal() {},
            startContentTour() { return false; },

            state,
          }, null); // <-- null roots: full body scan
          await new Promise((resolve) => setTimeout(resolve, 30));
          assert(hostA.querySelector(".plugin-highlight-word"), "hostA must be highlighted with null roots");
          assert(hostB.querySelector(".plugin-highlight-word"), "hostB must be highlighted with null roots");
          hostA.remove();
          hostB.remove();
        },
      },
      {
        name: "setupNavigationWatchers: extension highlight span mutations do NOT trigger highlightWords",
        async run() {
          let highlightCallCount = 0;
          const host = document.createElement("div");
          document.body.appendChild(host);
          const observer = U.setupNavigationWatchers({
            document,
            window,
            history,
            MutationObserver,
            Node,
            getLocationHref() { return location.href; },
            highlightWords() { highlightCallCount += 1; },
            onUrlChange() {},
          });
          // Insert extension's own highlight span — must NOT trigger highlightWords
          const span = document.createElement("span");
          span.className = "plugin-highlight-word";
          span.textContent = "run";
          host.appendChild(span);
          await new Promise((resolve) => setTimeout(resolve, 400));
          assertEqual(highlightCallCount, 0, "extension span insertion must not trigger highlightWords");
          observer.disconnect();
          host.remove();
        },
      },
      {
        name: "setupNavigationWatchers: non-extension DOM addition triggers highlightWords",
        async run() {
          let highlightCallCount = 0;
          let lastRoots;
          const host = document.createElement("div");
          document.body.appendChild(host);
          const observer = U.setupNavigationWatchers({
            document,
            window,
            history,
            MutationObserver,
            Node,
            getLocationHref() { return location.href; },
            highlightWords(roots) {
              highlightCallCount += 1;
              lastRoots = roots;
            },
            onUrlChange() {},
          });
          // Insert a real content element — must trigger highlightWords
          const newPara = document.createElement("p");
          newPara.textContent = "new SPA content loaded";
          host.appendChild(newPara);
          await new Promise((resolve) => setTimeout(resolve, 400));
          assert(highlightCallCount >= 1, "new content addition must trigger highlightWords");
          assert(Array.isArray(lastRoots), "roots should be an array for incremental scan");
          assert(lastRoots.includes(newPara), "new paragraph should be in roots");
          observer.disconnect();
          host.remove();
        },
      },
      {
        name: "highlightWords with disconnected roots skips them gracefully",
        async run() {
          const host = document.createElement("div");
          host.textContent = "run away";
          // Note: host is NOT appended to document.body, so it's disconnected
          const state = { pendingExampleMap: {}, exampleMergeTimer: null, contentTourAttempted: true, contentTourPending: false };
          let threw = false;
          try {
            U.highlightWords({
              document,
              Node,
              WordStorage: {
                getWords() { return Promise.resolve({ run: { meaning: "move", learned: false, examples: [] } }); },
                saveWords() { return Promise.resolve(); },
              },
              skipTags: new Set(["SCRIPT", "STYLE"]),
              isExtensionUiElement() { return false; },
              showWordPreview() {},
              hideWordPreview() {},
              splitIntoSentences(text) { return [text]; },
              isLowInformationExample() { return false; },
              normalizeText(text) { return (text || "").replace(/\s+/g, " ").trim(); },
              normalizeExampleList(e) { return e || []; },
              hasContainmentRelation() { return false; },
              isTooSimilarToAny() { return false; },
              enforceExampleLimit(e) { return e; },
              sortExamples(e) { return e; },
              maxExamplesPerWord: 20,
              currentHref() { return "https://example.com/"; },
              onMergeError(e) { throw e; },
              onHighlightError(e) { throw e; },
              markLearned() {},
              openAddWordModal() {},
              startContentTour() { return false; },
              isCurrentDomainExcluded() { return Promise.resolve(false); },
              state,
            }, [host]); // disconnected host
            await new Promise((resolve) => setTimeout(resolve, 30));
          } catch (e) {
            threw = true;
          }
          assert(!threw, "disconnected roots must not throw");
          assert(!host.querySelector(".plugin-highlight-word"), "disconnected root must not be highlighted");
        },
      },
      {
        name: "highlightWords uses explicit stored root when another word family form conflicts",
        async run() {
          const host = document.createElement("div");
          host.textContent = "run while running";
          document.body.appendChild(host);
          const calls = [];
          const previewCalls = [];
          const state = {
            pendingExampleMap: {},
            exampleMergeTimer: null,
            contentTourAttempted: true,
            contentTourPending: false,
          };
          U.highlightWords({
            document,
            Node,
            WordStorage: {
              getWords() {
                return Promise.resolve({
                  running: {
                    meaning: "continuous form",
                    learned: false,
                    examples: [],
                    familyForms: ["run"],
                  },
                  run: {
                    meaning: "root meaning",
                    learned: false,
                    examples: [],
                  },
                });
              },
              saveWords() {
                return Promise.resolve();
              },
            },
            skipTags: new Set(["SCRIPT", "STYLE"]),
            isExtensionUiElement() {
              return false;
            },
            showWordPreview(anchor, payload) {
              previewCalls.push({ text: anchor.textContent, payload });
            },
            hideWordPreview() {},
            splitIntoSentences(text) {
              return [text];
            },
            isLowInformationExample() { return false; },
            normalizeText(text) {
              return (text || "").replace(/\s+/g, " ").trim();
            },
            normalizeExampleList(entries) {
              return entries || [];
            },
            hasContainmentRelation() { return false; },
            isTooSimilarToAny() { return false; },
            enforceExampleLimit(entries) { return entries; },
            sortExamples(entries) { return entries; },
            maxExamplesPerWord: 20,
            currentHref() { return "https://example.com/page"; },
            onMergeError(error) { throw error; },
            onHighlightError(error) { throw error; },
            markLearned(text) {
              calls.push(`root:${text}`);
            },
            openAddWordModal(text) {
              calls.push(`family:${text}`);
            },
            startContentTour() {
              return true;
            },
            isCurrentDomainExcluded() {
              return Promise.resolve(false);
            },
            state,
          });
          try {
            await new Promise((resolve) => setTimeout(resolve, 30));
            const runHighlight = Array.from(host.querySelectorAll(".plugin-highlight-word")).find((el) => el.textContent === "run");
            const runningHighlight = Array.from(host.querySelectorAll(".plugin-highlight-word")).find((el) => el.textContent === "running");
            assert(runHighlight, "expected run highlight");
            assert(runningHighlight, "expected running highlight");
            assertEqual(runHighlight.classList.contains("plugin-highlight-family-word"), false);
            assertEqual(runningHighlight.classList.contains("plugin-highlight-family-word"), false);
            runHighlight.dispatchEvent(new MouseEvent("mouseenter", { bubbles: true }));
            runHighlight.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            assertEqual(calls.includes("root:run"), true);
            const runPreview = previewCalls.find((entry) => entry.text === "run");
            assert(runPreview, "expected run preview");
            assertEqual(runPreview.payload, "root meaning");
          } finally {
            host.remove();
          }
        },
      },
    ]);
